<!DOCTYPE html>
<!-- 모니터 전용 보기: 1920x1080 전체 화면, 스크롤 없음, 조작 버튼 없음, 1초 갱신 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>makerton 고색고 사거리 — 모니터</title>
<style>
  @font-face {
    font-family: "Pretendard Variable";
    src: url("/static/fonts/PretendardVariable.woff2") format("woff2");
    font-weight: 45 920;
    font-display: swap;
  }
  * { box-sizing: border-box; }
  :root{
    /* 흑백(회색조) 디자인: web/app/globals.css 의 :root 와 같은 값. 강조는 색이 아니라 반전(검정 바탕·밝은 글자)으로 한다. */
    --bright-snow:#f8f9fa; --platinum:#e9ecef; --alabaster-grey:#dee2e6; --pale-slate:#ced4da; --pale-slate-2:#adb5bd;
    --slate-grey:#6c757d; --iron-grey:#495057; --gunmetal:#343a40; --carbon-black:#212529;
    --ink:var(--carbon-black); --bg:var(--platinum); --card:var(--bright-snow); --line:var(--alabaster-grey); --muted:var(--iron-grey);
  }
  /* 1920x1080 화면 기준. 스크롤이 생기지 않도록 높이를 화면에 고정한다. */
  html, body { height:100%; }
  body { margin:0; overflow:hidden; background:var(--bg); color:var(--ink);
         font-family:"Pretendard Variable", Pretendard, "Apple SD Gothic Neo", sans-serif; font-size:20px; }
  header { height:92px; display:flex; align-items:center; gap:24px; padding:0 24px;
           background:var(--card); border-bottom:1px solid var(--pale-slate); }
  header .title { font-size:32px; font-weight:800; letter-spacing:-.5px; white-space:nowrap; }
  header .title span { color:var(--muted); }
  header .station { font-size:23px; font-weight:800; padding:6px 18px; border-radius:999px;
                    background:var(--platinum); border:1px solid var(--pale-slate); white-space:nowrap; }
  header .station.warn { background:var(--ink); color:var(--bright-snow); border-color:var(--ink); }
  header .grow { flex:1; }
  /* 자동 출동 꺼짐=반전(사람이 먼저 봐야 하는 상태), 켜짐=연한 회색 */
  header .auto { font-size:25px; font-weight:800; padding:8px 20px; border-radius:999px;
                 background:var(--ink); border:1px solid var(--ink); color:var(--bright-snow); white-space:nowrap; }
  header .auto.on { background:var(--platinum); border-color:var(--pale-slate); color:var(--ink); }
  header .clock { font-size:25px; font-weight:800; font-variant-numeric:tabular-nums;
                  color:var(--ink); white-space:nowrap; }
  main { height:calc(100vh - 92px); padding:14px 18px 16px; display:grid; gap:14px;
         grid-template-columns:minmax(0,700px) minmax(0,620px) minmax(0,1fr);
         grid-template-rows:minmax(0,1fr) minmax(0,0.5fr);
         grid-template-areas:"cross arms chart" "cross car events"; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px;
           overflow:hidden; display:flex; flex-direction:column; min-height:0; min-width:0; }
  .panel > h2 { margin:0; padding:9px 15px; font-size:20px; font-weight:800; color:var(--ink);
                background:var(--platinum); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;
                white-space:nowrap; overflow:hidden; }
  .panel > h2 small { margin-left:auto; font-size:15px; font-weight:700; color:var(--muted);
                      overflow:hidden; text-overflow:ellipsis; }
  .panel .body { padding:8px 13px; min-height:0; overflow:hidden; }
  #cross   { grid-area:cross; }
  #arms    { grid-area:arms; }
  #chartP  { grid-area:chart; }
  #carP    { grid-area:car; }
  #eventsP { grid-area:events; }
  #photoP  { grid-area:chart; }
  .panel[hidden] { display:none; }
  #photoBody { display:flex; flex-direction:column; flex:1; }
  /* 사진 판정: 출동(go) 판정이면 반전(검정 바탕), 아니면 연한 회색. /app 의 .vdecide 와 같은 규칙 */
  .photo-decide { font-size:23px; font-weight:800; line-height:1.4; padding:10px 14px; border-radius:10px;
                  background:var(--platinum); color:var(--ink); }
  .photo-decide.go { background:var(--ink); color:var(--bright-snow); }
  .photo-claude { font-size:21px; font-weight:700; color:var(--gunmetal); line-height:1.45; margin-top:10px; }
  .photo-think { flex:1; min-height:0; overflow:hidden; margin-top:12px; padding-top:10px; border-top:1px dashed var(--pale-slate-2);
                 font-size:18px; line-height:1.55; color:var(--muted); white-space:pre-wrap; }
  svg.cross { display:block; width:100%; height:100%; background:var(--platinum); }
  table.arms { width:100%; border-collapse:collapse; font-size:19px; table-layout:fixed; }
  table.arms th { text-align:left; padding:7px 5px; color:var(--muted); font-size:15px;
                  border-bottom:2px solid var(--pale-slate); font-weight:800; white-space:nowrap; }
  table.arms td { padding:8px 5px; border-bottom:1px solid var(--line); font-weight:700;
                  vertical-align:middle; white-space:nowrap; overflow:hidden;
                  text-overflow:ellipsis; }
  table.arms td.num { text-align:right; font-variant-numeric:tabular-nums; font-size:24px; }
  /* 위험 단계는 회색 농도로 구분한다: 높을수록 진하고, risk3 은 반전(검정 바탕·밝은 글자). 글자 표식(▲, ✓)은 그대로 둔다 */
  .lv { display:inline-block; padding:2px 10px; border-radius:999px; font-size:16px; font-weight:800;
        color:var(--ink); white-space:nowrap; border:1px solid transparent; }
  .lv.risk1 { background:var(--alabaster-grey); border-color:var(--pale-slate); }
  .lv.risk2 { background:var(--pale-slate-2); border-color:var(--slate-grey); }
  .lv.risk3 { background:var(--ink); color:var(--bright-snow); border-color:var(--ink); }
  .lv.done  { background:var(--card); border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
  .lv.off   { background:transparent; color:var(--muted); border:1px dashed var(--pale-slate-2); }
  .mid { font-size:22px; font-weight:800; }
  .sub { font-size:16px; color:var(--muted); font-weight:700; }
  .pulse { animation:blink 1.1s steps(1, end) infinite; }
  @keyframes blink { 0%, 55% { opacity:.2; } 56%, 100% { opacity:1; } }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:5px 14px; font-size:19px; }
  .kv b { color:var(--muted); font-weight:700; white-space:nowrap; }
  .kv span { font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  ul.events { list-style:none; margin:0; padding:0 0 20px; font-size:17px; }
  ul.events li { display:grid; grid-template-columns:74px 88px 1fr; gap:8px; padding:3px 0;
                 border-bottom:1px dashed var(--pale-slate); font-weight:600; }
  ul.events time { color:var(--muted); font-variant-numeric:tabular-nums; }
  ul.events .kind { font-weight:800; color:var(--ink); }
  ul.events li span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar { height:13px; border-radius:999px; background:var(--alabaster-grey); overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:var(--ink); }
  #chartBody { display:flex; flex-direction:column; gap:4px; height:100%; }
  #chartSvg { flex:1; min-height:0; width:100%; }
  .url { position:fixed; right:14px; bottom:8px; font-size:13px; font-weight:700;
         color:var(--muted); background:var(--card); border:1px solid var(--line); padding:2px 8px; border-radius:6px;
         opacity:.92; }
</style>
</head>
<body>
<header>
  <div class="title">고색고 사거리 <span>결빙 예보</span></div>
  <div class="station" id="station">지점 —</div>
  <div class="grow"></div>
  <div class="auto" id="autoState">자동 출동 —</div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<main>
  <section class="panel" id="cross">
    <svg class="cross" id="crossSvg" viewBox="-30 -30 1010 1020" preserveAspectRatio="xMidYMid meet">
      <g id="boardLayer"></g>
      <g id="armsLayer"></g>
      <g id="baseLayer"></g>
      <g id="carLayer"></g>
    </svg>
  </section>

  <section class="panel" id="arms">
    <h2>갈래별 예측 동결확률 <small id="armsNote">—</small></h2>
    <div class="body">
      <table class="arms">
        <colgroup><col style="width:25%"><col style="width:13%"><col style="width:21%">
          <col style="width:23%"><col style="width:18%"></colgroup>
        <thead><tr><th>갈래</th><th>확률</th><th>단계</th><th>기온/습도</th><th>현장</th></tr></thead>
        <tbody id="armRows"></tbody>
      </table>
      <div class="sub" id="armsFoot" style="margin-top:8px; line-height:1.45">—</div>
    </div>
  </section>

  <section class="panel" id="chartP">
    <h2>예보 그래프 <small id="chartNote">—</small></h2>
    <div class="body" id="chartBody">
      <svg id="chartSvg" viewBox="0 0 520 552" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </section>

  <!-- 패드로 사진을 찍으면 예보 그래프 자리에 잠시 사진 판정과 Claude의 생각을 띄운다 -->
  <section class="panel" id="photoP" hidden>
    <h2>사진 판정 <small id="photoNote">—</small></h2>
    <div class="body" id="photoBody">
      <div class="photo-decide" id="photoDecide">—</div>
      <div class="photo-claude" id="photoClaude"></div>
      <div class="photo-think" id="photoThink"></div>
    </div>
  </section>

  <section class="panel" id="carP">
    <h2>제설차 · 기지 <small id="carNote">—</small></h2>
    <div class="body" style="flex:1">
      <div class="kv">
        <b>상태</b><span id="carState">대기</span>
        <b>진행</b><span id="carPhase">대기</span>
        <b>위치</b><span id="carPos">—</span>
        <b>계획</b><span id="carPlan">—</span>
        <b>도킹</b><span id="baseDock">—</span>
        <b>보충</b><span id="baseRefill">—</span>
      </div>
      <div class="bar" style="margin-top:8px"><i id="carBar"></i></div>
      <div class="mid" id="carHint" style="margin-top:8px">—</div>
    </div>
  </section>

  <section class="panel" id="eventsP">
    <h2>최근 이벤트</h2>
    <div class="body" style="flex:1">
      <ul class="events" id="eventList"></ul>
    </div>
  </section>

  <div class="url" id="url">—</div>
</main>

<script>
(function () {
  'use strict';
  var ARMS = ['N', 'E', 'S', 'W'];
  // 갈래 카드 채움/테두리: 위험이 높을수록 진한 회색, risk3 는 반전(검정). 처리됨은 흰 바탕+굵은 검정 테두리, 자료 없음은 점선
  var LEVEL_COLOR = {risk1: '#f8f9fa', risk2: '#adb5bd', risk3: '#212529', done: '#f8f9fa', off: '#e9ecef'};
  var LEVEL_LINE  = {risk1: '#adb5bd', risk2: '#495057', risk3: '#212529', done: '#212529', off: '#adb5bd'};
  var LEVEL_KR = {risk1: '낮음', risk2: '주의', risk3: '높음', done: '처리됨', off: '자료 없음'};
  var LEVEL_MARK = {risk1: '▲', risk2: '▲▲', risk3: '▲▲▲', done: '✓', off: '·'};
  var EXEC_KR = {idle: '대기', running: '출동 중', done: '완료', failed: '중단', stopped: '정지'};
  var PHASE_KR = {idle: '대기', depart: '기지 출발', turn: '회전', out: '전진·살포',
                  back: '복귀', home: '기지 귀환'};
  var PHOTO_HOLD_S = 180;   // 사진 판정을 예보 그래프 대신 보여 주는 시간

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function num(v, digits) {
    if (v === null || v === undefined || isNaN(Number(v))) return '—';
    return Number(v).toFixed(digits === undefined ? 1 : digits);
  }
  function shortName(value) {
    var text = String(value || '');
    return text.length > 7 ? (text.slice(0, 6) + '…') : text;
  }
  function boardOf(st) {
    var b = st.board || {};
    var ends = b.ARM_END_MM || {N: 480, E: 343, W: 582, S: 430};
    var base = b.BASE_XY || [775, 250];
    return {
      cx: Number(b.CENTER_X) || 582,
      cy: Number(b.CENTER_Y) || 480,
      road: Number(b.ROAD_MM) || 135,
      nEnd: Number(ends.N) || 480,
      eEnd: Number(ends.E) || 343,
      wEnd: Number(ends.W) || 582,
      sEnd: Number(ends.S) || 430,
      bx: Number(base[0]) || 775,
      by: Number(base[1]) || 250,
      bh: (b.BASE_H === undefined || b.BASE_H === null) ? 270 : Number(b.BASE_H)
    };
  }
  function garageOf(B) {
    return {x: B.bx - 85, y: B.by - 70, w: 160, h: 140};
  }
  function levelOf(armId, armData, treated) {
    if (treated && treated[armId]) return 'done';
    return (armData && armData.level) || 'off';
  }

  // ------------------------------------------------------------ 사거리 그림
  function drawBoard(st) {
    var B = boardOf(st);
    var x0 = B.cx - B.wEnd, x1 = B.cx + B.eEnd;
    var y0 = B.cy - B.nEnd, y1 = B.cy + B.sEnd;
    var r = B.road / 2;
    var G = garageOf(B);
    var out = [];

    // 도로
    out.push('<rect x="' + (B.cx - r) + '" y="' + y0 + '" width="' + B.road +
             '" height="' + (y1 - y0) + '" fill="#343a40"/>');
    out.push('<rect x="' + x0 + '" y="' + (B.cy - r) + '" width="' + (x1 - x0) +
             '" height="' + B.road + '" fill="#343a40"/>');
    // 차선(교차로 안은 비운다)
    var dash = ' stroke="#ced4da" stroke-width="3" stroke-dasharray="22 16"';
    out.push('<line x1="' + B.cx + '" y1="' + y0 + '" x2="' + B.cx + '" y2="' + (B.cy - r) + '"' + dash + '/>');
    out.push('<line x1="' + B.cx + '" y1="' + (B.cy + r) + '" x2="' + B.cx + '" y2="' + y1 + '"' + dash + '/>');
    out.push('<line x1="' + x0 + '" y1="' + B.cy + '" x2="' + (B.cx - r) + '" y2="' + B.cy + '"' + dash + '/>');
    out.push('<line x1="' + (B.cx + r) + '" y1="' + B.cy + '" x2="' + x1 + '" y2="' + B.cy + '"' + dash + '/>');

    // 제설 기지(북동쪽 건물): 차고는 BASE_XY, 출입구는 서쪽 면이고 N 도로로 이어진다
    out.push('<rect x="' + (B.cx + r) + '" y="' + (B.by - 40) + '" width="' + (G.x - B.cx - r) +
             '" height="80" fill="#343a40"/>');
    out.push('<rect x="' + G.x + '" y="' + G.y + '" width="' + G.w + '" height="' + G.h +
             '" rx="6" fill="#f8f9fa" stroke="#212529" stroke-width="3"/>');
    out.push('<line x1="' + G.x + '" y1="' + (B.by - 40) + '" x2="' + G.x + '" y2="' + (B.by + 40) +
             '" stroke="#f8f9fa" stroke-width="6"/>');
    out.push('<text x="' + (G.x + G.w / 2) + '" y="' + (G.y + G.h + 28) + '" font-size="22" ' +
             'font-weight="800" fill="#212529" text-anchor="middle">제설 기지</text>');

    // 나침반
    out.push('<text x="' + B.cx + '" y="' + (y0 + 22) + '" font-size="22" font-weight="800" ' +
             'fill="#dee2e6" text-anchor="middle">북 N ↑</text>');
    document.getElementById('boardLayer').innerHTML = out.join('');
  }

  function drawBase(st) {
    var G = garageOf(boardOf(st));
    var base = st.base || {};
    var out = [];
    var bx = G.x + G.w - 16, by = G.y + 16;
    out.push('<circle cx="' + bx + '" cy="' + by + '" r="9" fill="' +
             (base.beacon ? '#212529' : '#f8f9fa') + '" stroke="#212529" stroke-width="2"/>');
    if (base.beacon) {
      out.push('<circle class="pulse" cx="' + bx + '" cy="' + by + '" r="17" fill="none" ' +
               'stroke="#212529" stroke-width="3"/>');
    }
    var dock = base.dock;
    var refills = (base.refills === null || base.refills === undefined) ? '—' : base.refills;
    out.push('<text x="' + (G.x + G.w / 2) + '" y="' + (G.y + G.h + 54) + '" font-size="17" ' +
             'font-weight="800" fill="' + (dock ? '#495057' : '#212529') + '" text-anchor="middle">도킹 ' +
             (dock === null || dock === undefined ? '—' : (dock ? '✓' : '이탈')) + ' · 보충 ' + refills +
             (base.refilling ? ' (보충 중)' : '') + '</text>');
    document.getElementById('baseLayer').innerHTML = out.join('');
  }

  function drawArms(st) {
    var step = st.step || {};
    var arms = step.arms || {};
    var treated = st.treated || {};
    var order = ((step.dispatch || {}).order) || [];
    var out = [];

    function card(armId, x, y) {
      var w = 300, h = 200;
      var a = arms[armId] || {};
      var level = levelOf(armId, a, treated);
      var color = LEVEL_COLOR[level] || LEVEL_COLOR.off;
      var line = LEVEL_LINE[level] || LEVEL_LINE.off;
      out.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
               '" rx="12" fill="' + color + '" stroke="' + line + '" stroke-width="4"' +
               (level === 'off' ? ' stroke-dasharray="14 10"' : '') + '/>');
      if (level === 'risk3') {
        out.push('<rect class="pulse" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
                 '" rx="12" fill="none" stroke="' + line + '" stroke-width="8"/>');
      }
      var idx = order.indexOf(armId);
      var fg = level === 'risk3' ? '#f8f9fa' : (level === 'off' ? '#495057' : '#212529');
      var cx = x + w / 2;
      var lines = [
        [armId + ' ' + shortName(a.name), 22, 36],
        [num(a.p_max, 2), 50, 96],
        [LEVEL_MARK[level] + ' ' + LEVEL_KR[level], 22, 128],
        ['+3h ' + num((a.t_eff || {}).h3) + '℃', 20, 156],
        [treated[armId] ? ('✓ 처리 ' + String(treated[armId]).slice(11, 16) + '까지')
                        : (idx >= 0 ? ((idx + 1) + '순위 출동')
                                    : ('현장 ' + (a.local_dt === null || a.local_dt === undefined
                                                 ? '0.0' : num(a.local_dt)) + '℃')), 20, 184]
      ];
      lines.forEach(function (line) {
        out.push('<text x="' + cx + '" y="' + (y + line[2]) + '" font-size="' + line[1] +
                 '" font-weight="800" fill="' + fg + '" text-anchor="middle">' +
                 esc(line[0]) + '</text>');
      });
    }

    // 카드는 도로 밖 네 모퉁이에 둔다. 북동쪽은 기지 차고 위에 둔다(차·도로·차고를 가리지 않게).
    card('N', 20, -25);
    card('E', 655, -25);
    card('W', 20, 580);
    card('S', 655, 580);
    document.getElementById('armsLayer').innerHTML = out.join('');
  }

  function drawCar(st) {
    var B = boardOf(st);
    var base = st.base || {};
    var car = (st.car || {}).tel || {};
    var known = car.x !== null && car.x !== undefined && car.y !== null && car.y !== undefined;
    var docked = !known || (base.dock && (car.state === 'idle' || car.state === 'done' || !car.state));
    var cx = docked ? B.bx : Number(car.x);
    var cy = docked ? B.by : Number(car.y);
    var ch = (docked || car.h === null || car.h === undefined) ? B.bh : Number(car.h);
    var moving = (car.state === 'run' || car.state === 'pause');
    var fill = moving ? '#f8f9fa' : '#ced4da';
    var out = [];
    out.push('<g transform="translate(' + cx + ',' + cy + ') rotate(' + ch + ')">' +
             '<polygon points="0,-80 16,-56 -16,-56" fill="' + fill + '" stroke="#212529" stroke-width="3" stroke-linejoin="round"/>' +
             '<rect x="-38" y="-58" width="76" height="116" rx="14" fill="' + fill +
             '" stroke="#212529" stroke-width="3"/>' +
             (car.spray ? '<circle cx="0" cy="0" r="58" fill="none" stroke="#212529" stroke-width="9"/>' +
                          '<circle cx="0" cy="0" r="58" fill="none" stroke="#f8f9fa" stroke-width="4"/>' : '') +
             '</g>');
    if (Math.abs(cx - B.bx) > 5 || Math.abs(cy - B.by) > 5) {      // 차고 안에서는 기지 글씨와 겹치지 않게 뺀다
      out.push('<text x="' + cx + '" y="' + (cy + 82) + '" font-size="19" font-weight="800" ' +
               'fill="#212529" stroke="#f8f9fa" stroke-width="5" paint-order="stroke" stroke-linejoin="round" ' +
               'text-anchor="middle">' +
               esc(PHASE_KR[car.phase] || car.phase || '대기') + '</text>');
    }
    document.getElementById('carLayer').innerHTML = out.join('');
  }

  function drawChart(st) {
    var svg = document.getElementById('chartSvg');
    var series = st.series || {};
    if (!series.ready || !series.time || !series.time.length) {
      svg.innerHTML = '<text x="260" y="276" text-anchor="middle" font-size="19" fill="#495057">' +
        esc(series.note || '계산 중') + '</text>';
      document.getElementById('chartNote').textContent = '계산 중';
      return;
    }
    var times = series.time, obs = series.obs_ground, pred = series.pred_h3;
    var values = [0];
    for (var i = 0; i < obs.length; i++) {
      if (obs[i] !== null && obs[i] !== undefined) values.push(obs[i]);
      if (pred[i] !== null && pred[i] !== undefined) values.push(pred[i]);
    }
    var lo = Math.min.apply(null, values) - 1.5;
    var hi = Math.max.apply(null, values) + 1.5;
    var W = 520, H = 552, padL = 56, padR = 14, padT = 66, padB = 32;
    function xOf(i) { return padL + (W - padL - padR) * (times.length <= 1 ? 0.5 : i / (times.length - 1)); }
    function yOf(v) { return padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo)); }
    var out = [];
    for (var g = 0; g <= 3; g++) {
      var v = lo + (hi - lo) * g / 3;
      var y = yOf(v);
      out.push('<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y +
               '" stroke="#dee2e6" stroke-width="1"/>');
      out.push('<text x="' + (padL - 6) + '" y="' + (y + 5) + '" font-size="15" fill="#495057" ' +
               'text-anchor="end">' + v.toFixed(1) + '</text>');
    }
    if (lo <= 0 && hi >= 0) {
      out.push('<line x1="' + padL + '" y1="' + yOf(0) + '" x2="' + (W - padR) + '" y2="' + yOf(0) +
               '" stroke="#6c757d" stroke-width="2" stroke-dasharray="7 6"/>');
      out.push('<text x="' + (W - padR - 2) + '" y="' + (yOf(0) - 7) +
               '" font-size="15" font-weight="800" fill="#212529" text-anchor="end">0℃</text>');
    }
    function path(arr, color, dash, width) {
      var d = '', started = false;
      for (var i = 0; i < arr.length; i++) {
        var val = arr[i];
        if (val === null || val === undefined) { started = false; continue; }
        d += (started ? ' L' : ' M') + xOf(i).toFixed(1) + ' ' + yOf(val).toFixed(1);
        started = true;
      }
      if (!d) return '';
      return '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' + width +
             '" stroke-linejoin="round"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
    }
    // 관측=굵은 검정 실선, 예측=회색 점선
    out.push(path(pred, '#6c757d', '10 7', 2.5));
    out.push(path(obs, '#212529', '', 3.5));
    var idx = (st.replay || {}).index;
    if (typeof idx === 'number' && idx >= 0 && idx < times.length) {
      out.push('<line x1="' + xOf(idx) + '" y1="' + padT + '" x2="' + xOf(idx) + '" y2="' + (H - padB) +
               '" stroke="#495057" stroke-width="2" stroke-dasharray="5 4"/>');
    }
    [0, Math.floor(times.length / 2), times.length - 1].forEach(function (i) {
      if (times[i] === undefined) return;
      out.push('<text x="' + xOf(i) + '" y="' + (H - 8) + '" font-size="15" fill="#495057" ' +
               'text-anchor="middle">' + esc(String(times[i]).slice(11, 16)) + '</text>');
    });
    // 그래프 안 범례
    var legendY = 36;
    out.push('<line x1="' + padL + '" y1="' + legendY + '" x2="' + (padL + 34) + '" y2="' + legendY +
             '" stroke="#212529" stroke-width="3.5"/>');
    out.push('<text x="' + (padL + 42) + '" y="' + (legendY + 5) + '" font-size="15" ' +
             'font-weight="700" fill="#212529">관측 지면</text>');
    out.push('<line x1="' + (padL + 132) + '" y1="' + legendY + '" x2="' + (padL + 166) + '" y2="' +
             legendY + '" stroke="#6c757d" stroke-width="2.5" stroke-dasharray="10 7"/>');
    out.push('<text x="' + (padL + 174) + '" y="' + (legendY + 5) + '" font-size="15" ' +
             'font-weight="700" fill="#495057">+3h 예측</text>');
    out.push('<line x1="' + (padL + 268) + '" y1="' + (legendY - 7) + '" x2="' + (padL + 268) +
             '" y2="' + (legendY + 7) + '" stroke="#495057" stroke-width="2" stroke-dasharray="4 4"/>');
    out.push('<text x="' + (padL + 276) + '" y="' + (legendY + 5) + '" font-size="15" ' +
             'font-weight="700" fill="#495057">현재</text>');
    svg.innerHTML = out.join('');
    document.getElementById('chartNote').textContent = series.note || '';
  }

  function drawPhoto(st) {
    var v = st.vision || {}, live = st.vision_live, eye = v.eye;
    var think = document.getElementById('photoThink');
    if (live) {
      document.getElementById('photoNote').textContent = 'Claude가 사진을 보는 중…';
      document.getElementById('photoDecide').textContent = '판정 중';
      document.getElementById('photoDecide').className = 'photo-decide';
      document.getElementById('photoClaude').textContent = '';
      think.textContent = live.thinking || '';
    } else {
      document.getElementById('photoNote').textContent = (v.time || '') + (eye && eye.secs ? ' · Claude ' + eye.secs + '초' : '');
      document.getElementById('photoDecide').textContent = v.decision ? v.decision.text : '—';
      document.getElementById('photoDecide').className = 'photo-decide' + (v.decision && v.decision.go ? ' go' : '');
      document.getElementById('photoClaude').textContent = !eye ? (st.claude ? '' : 'Claude 꺼짐: 규칙으로만 판단') :
        eye.error ? 'Claude 판정 실패: ' + eye.error : 'Claude: ' + (eye.usable === false ? '사진으로는 판단하기 어려움. ' : '') + (eye.note || '');
      think.textContent = eye && eye.thinking ? eye.thinking : '';
    }
    think.scrollTop = think.scrollHeight;   // 넘치면 가장 최근 생각이 보이게
  }

  function render(st) {
    var station = st.station || {};
    var el = document.getElementById('station');
    el.textContent = (station.label || '지점 —');
    el.className = 'station' + (station.replaced ? ' warn' : '');
    var auto = document.getElementById('autoState');
    auto.textContent = '자동 출동 ' + (st.auto ? '켜짐' : '꺼짐');
    auto.className = 'auto' + (st.auto ? ' on' : '');
    document.getElementById('clock').textContent =
      st.replay && st.replay.ts ? String(st.replay.ts).replace('T', ' ').slice(5) : (st.time || '');

    drawBoard(st);
    drawArms(st);
    drawBase(st);
    drawCar(st);
    var v = st.vision, live = st.vision_live;
    var photo = !!(live || (v && v.ts && Date.now() / 1000 - v.ts < PHOTO_HOLD_S));
    document.getElementById('chartP').hidden = photo;
    document.getElementById('photoP').hidden = !photo;
    if (photo) drawPhoto(st); else drawChart(st);

    var step = st.step || {};
    var arms = step.arms || {};
    var treated = st.treated || {};
    var rows = (st.sensor || {}).rows || {};
    document.getElementById('armRows').innerHTML = ARMS.map(function (a) {
      var row = arms[a] || {};
      var level = levelOf(a, row, treated);
      var sensor = rows[a] || {};
      var tempText = (sensor.t === null || sensor.t === undefined) ? '—' : (num(sensor.t) + '℃');
      var rhText = (sensor.rh === null || sensor.rh === undefined) ? '—' : (sensor.rh + '%');
      var tEff = (row.t_eff || {}).h3;
      return '<tr><td>' + a + ' <span class="sub">' + esc(shortName(row.name)) + '</span></td>' +
        '<td class="num">' + num(row.p_max, 2) + '</td>' +
        '<td><span class="lv ' + level + '">' + LEVEL_MARK[level] + ' ' + LEVEL_KR[level] + '</span></td>' +
        '<td title="+3h 유효온도 ' + num(tEff) + '℃">' + tempText + ' / ' + rhText + '</td>' +
        '<td>' + (row.local_dt === null || row.local_dt === undefined ? '—' : num(row.local_dt) + '℃') +
        (sensor.wet ? ' <span class="sub">젖음</span>' : '') + '</td></tr>';
    }).join('');
    var disp = step.dispatch || {};
    document.getElementById('armsNote').textContent =
      st.engine && st.engine.error ? st.engine.error : ('출동 제안 ' + ((disp.order || []).join(' → ') || '없음'));
    document.getElementById('armsFoot').textContent =
      '예측 동결확률 p_max · 처리된 갈래는 ✓ 로 바꾸고 후보에서 뺍니다 · 예산 ' + st.budget + '갈래';

    var car = st.car || {}, tel = car.tel || {}, ex = st.execution || {}, base = st.base || {};
    document.getElementById('carNote').textContent =
      car.mode === 'none' ? '링크 없음(모의 실행)' : (car.ok ? '연결됨' : '링크 끊김');
    document.getElementById('carState').textContent =
      (EXEC_KR[ex.state] || ex.state || '대기') + (ex.mode === 'mock' ? ' (모의)' : '');
    document.getElementById('carPhase').textContent =
      (PHASE_KR[tel.phase] || tel.phase || '대기') + (tel.arm ? (' · ' + tel.arm) : '') +
      (tel.spray ? ' · 살포 중' : '');
    document.getElementById('carPos').textContent =
      (tel.x === null || tel.x === undefined ? '—' : (num(tel.x, 0) + ' , ' + num(tel.y, 0))) +
      (tel.h === null || tel.h === undefined ? '' : (' · ' + num(tel.h, 0) + '°'));
    document.getElementById('carPlan').textContent =
      (ex.plan_id || '—') + ' · ' + ((ex.order || []).join(' → ') || '—');
    document.getElementById('baseDock').textContent =
      base.ok ? (base.dock ? '도킹됨' : '이탈') : '기지 신호 없음';
    document.getElementById('baseRefill').textContent =
      base.refilling ? ((base.refills === null || base.refills === undefined ? '—' : base.refills) + '회 · 보충 중')
                     : ((base.refills === null || base.refills === undefined ? '—' : base.refills + '회'));
    var total = (ex.order || []).length || 0;
    var done = (ex.done || []).length || 0;
    document.getElementById('carBar').style.width = (total ? Math.round(100 * done / total) : 0) + '%';
    document.getElementById('carHint').textContent = ex.state === 'running'
      ? ('지금 ' + (ex.current || '—') + ' 갈래')
      : ((disp.order || []).length ? ('다음 출동 ' + disp.order.join(' → ')) :
         (st.auto ? (base.dock === false ? '기지 도킹 대기' : '출동 대기') : '자동 출동 꺼짐'));

    var list = (st.events || []).slice(-7).reverse();
    document.getElementById('eventList').innerHTML = list.map(function (e) {
      return '<li><time>' + esc(e.time || '') + '</time><span class="kind">' + esc(e.kind || '') +
             '</span><span>' + esc(e.text || '') + '</span></li>';
    }).join('') || '<li class="sub">아직 이벤트가 없습니다.</li>';

    document.getElementById('url').textContent =
      st.monitor_url || (location.host ? ('http://' + location.host + '/monitor') : '');
  }

  function refresh() {
    fetch('/api/state', {cache: 'no-store'})
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () {
        document.getElementById('station').textContent = '서버 응답 없음';
      });
  }

  refresh();
  setInterval(refresh, 1000);
})();
</script>
</body>
</html>
