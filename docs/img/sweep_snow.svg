<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" width="1800" height="1000" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif"><title>눈 조각과 조도센서</title><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="30" text-anchor="start" font-weight="900" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">눈 조각과 조도센서 — 덮이면 어두워진다</text><text x="42.0" y="82.0" font-size="15" text-anchor="start" font-weight="600" fill="#014f86" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">센서는 보드 구멍에 아래에서 끼워 위를 보게 한다. 눈 조각 밑면은 검은 테이프·은박지로 빛을 막는다.</text><rect x="40.0" y="110.0" width="840.0" height="520.0" rx="12" fill="#f5f9fc" stroke="#c7dce8" stroke-width="1.5"/><rect x="40.0" y="110.0" width="840.0" height="34" rx="12" fill="#014f86"/><rect x="40.0" y="130.0" width="840.0" height="14" fill="#014f86"/><text x="56.0" y="133.0" font-size="16" text-anchor="start" font-weight="800" fill="#ffffff" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">맑음: 센서가 밝다</text><rect x="120.00" y="420.00" width="680.00" height="40.00" rx="0.00" fill="#f3f1ea" stroke="#c9c4b4" stroke-width="1.50" /><rect x="420.00" y="420.00" width="80.00" height="40.00" rx="0.00" fill="#ffffff" stroke="#c9c4b4" stroke-width="1.00" /><rect x="120.00" y="414.00" width="680.00" height="6.00" rx="0.00" fill="#1f2226" stroke="none" stroke-width="0.20" /><rect x="420.00" y="414.00" width="80.00" height="6.00" rx="0.00" fill="#ffffff" stroke="none" stroke-width="0.20" /><g transform="translate(420.00 430.00) scale(4.0000)"><rect x="0.00" y="0.00" width="20.00" height="17.00" rx="0.80" fill="#1f2329" stroke="#000" stroke-width="0.30" /><rect x="0.60" y="0.60" width="18.80" height="15.80" rx="0.50" fill="none" stroke="#cfd4da" stroke-width="0.20" /><circle cx="13.40" cy="6.20" r="3.70" fill="#f0ead6" stroke="#b7ae93" stroke-width="0.30" /><path d="M 10.70 3.20 L 16.10 3.20 M 16.10 4.40 L 10.70 4.40 M 10.70 5.60 L 16.10 5.60 M 16.10 6.80 L 10.70 6.80 M 10.70 8.00 L 16.10 8.00 M 16.10 9.20 L 10.70 9.20" fill="none" stroke="#8a4a1e" stroke-width="0.32" /><circle cx="13.40" cy="6.20" r="1.00" fill="none" stroke="#8a4a1e" stroke-width="0.30" /><rect x="4.70" y="12.40" width="8.20" height="4.00" rx="0.25" fill="#141414" stroke="#000" stroke-width="0.12" /><circle cx="6.00" cy="14.40" r="0.72" fill="#d8b45a" stroke="#8d6f28" stroke-width="0.10" /><circle cx="8.54" cy="14.40" r="0.72" fill="#d8b45a" stroke="#8d6f28" stroke-width="0.10" /><circle cx="11.08" cy="14.40" r="0.72" fill="#d8b45a" stroke="#8d6f28" stroke-width="0.10" /><text x="3.40" y="10.60" font-size="1.30" text-anchor="middle" font-weight="700" fill="#e6eaee" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">CdS</text></g><text x="460.0" y="530.0" font-size="13" text-anchor="middle" font-weight="800" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">KY-018 (구멍에 아래서 끼움)</text><text x="180.0" y="450.0" font-size="13" text-anchor="start" font-weight="700" fill="#64748b" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">보드(우드락) + 검은 도로</text><line x1="350.0" y1="220.0" x2="408.2" y2="402.3" stroke="#f2c230" stroke-width="3.0" stroke-linecap="round"/><path d="M 410.0 408.0 L 403.3 400.5 L 411.1 398.1 Z" fill="#f2c230"/><line x1="400.0" y1="220.0" x2="433.9" y2="402.1" stroke="#f2c230" stroke-width="3.0" stroke-linecap="round"/><path d="M 435.0 408.0 L 429.3 399.8 L 437.3 398.3 Z" fill="#f2c230"/><line x1="450.0" y1="220.0" x2="459.7" y2="402.0" stroke="#f2c230" stroke-width="3.0" stroke-linecap="round"/><path d="M 460.0 408.0 L 455.4 399.1 L 463.6 398.7 Z" fill="#f2c230"/><line x1="500.0" y1="220.0" x2="485.5" y2="402.0" stroke="#f2c230" stroke-width="3.0" stroke-linecap="round"/><path d="M 485.0 408.0 L 481.7 398.6 L 489.8 399.2 Z" fill="#f2c230"/><line x1="550.0" y1="220.0" x2="511.2" y2="402.1" stroke="#f2c230" stroke-width="3.0" stroke-linecap="round"/><path d="M 510.0 408.0 L 507.9 398.2 L 515.9 399.9 Z" fill="#f2c230"/><rect x="424.1" y="184.0" width="71.8" height="22.0" rx="11.0" fill="#ffffff" stroke="#8a6d00" stroke-width="1.4"/><text x="460.0" y="199.7" font-size="13" text-anchor="middle" font-weight="800" fill="#8a6d00" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">주변 조명</text><rect x="663.3" y="269.0" width="113.4" height="22.0" rx="11.0" fill="#ffffff" stroke="#2c7da0" stroke-width="1.4"/><text x="720.0" y="284.7" font-size="13" text-anchor="middle" font-weight="800" fill="#2c7da0" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">ADC raw 기준값</text><rect x="920.0" y="110.0" width="840.0" height="520.0" rx="12" fill="#f5f9fc" stroke="#c7dce8" stroke-width="1.5"/><rect x="920.0" y="110.0" width="840.0" height="34" rx="12" fill="#014f86"/><rect x="920.0" y="130.0" width="840.0" height="14" fill="#014f86"/><text x="936.0" y="133.0" font-size="16" text-anchor="start" font-weight="800" fill="#ffffff" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">눈 조각이 덮음: 어두워짐 → 눈 감지</text><rect x="1000.00" y="420.00" width="680.00" height="40.00" rx="0.00" fill="#f3f1ea" stroke="#c9c4b4" stroke-width="1.50" /><rect x="1300.00" y="420.00" width="80.00" height="40.00" rx="0.00" fill="#ffffff" stroke="#c9c4b4" stroke-width="1.00" /><rect x="1000.00" y="414.00" width="680.00" height="6.00" rx="0.00" fill="#1f2226" stroke="none" stroke-width="0.20" /><rect x="1300.00" y="414.00" width="80.00" height="6.00" rx="0.00" fill="#ffffff" stroke="none" stroke-width="0.20" /><g transform="translate(1300.00 430.00) scale(4.0000)"><rect x="0.00" y="0.00" width="20.00" height="17.00" rx="0.80" fill="#1f2329" stroke="#000" stroke-width="0.30" /><rect x="0.60" y="0.60" width="18.80" height="15.80" rx="0.50" fill="none" stroke="#cfd4da" stroke-width="0.20" /><circle cx="13.40" cy="6.20" r="3.70" fill="#f0ead6" stroke="#b7ae93" stroke-width="0.30" /><path d="M 10.70 3.20 L 16.10 3.20 M 16.10 4.40 L 10.70 4.40 M 10.70 5.60 L 16.10 5.60 M 16.10 6.80 L 10.70 6.80 M 10.70 8.00 L 16.10 8.00 M 16.10 9.20 L 10.70 9.20" fill="none" stroke="#8a4a1e" stroke-width="0.32" /><circle cx="13.40" cy="6.20" r="1.00" fill="none" stroke="#8a4a1e" stroke-width="0.30" /><rect x="4.70" y="12.40" width="8.20" height="4.00" rx="0.25" fill="#141414" stroke="#000" stroke-width="0.12" /><circle cx="6.00" cy="14.40" r="0.72" fill="#d8b45a" stroke="#8d6f28" stroke-width="0.10" /><circle cx="8.54" cy="14.40" r="0.72" fill="#d8b45a" stroke="#8d6f28" stroke-width="0.10" /><circle cx="11.08" cy="14.40" r="0.72" fill="#d8b45a" stroke="#8d6f28" stroke-width="0.10" /><text x="3.40" y="10.60" font-size="1.30" text-anchor="middle" font-weight="700" fill="#e6eaee" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">CdS</text></g><text x="1340.0" y="530.0" font-size="13" text-anchor="middle" font-weight="800" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">KY-018 (구멍에 아래서 끼움)</text><text x="1060.0" y="450.0" font-size="13" text-anchor="start" font-weight="700" fill="#64748b" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">보드(우드락) + 검은 도로</text><rect x="1250.00" y="354.00" width="180.00" height="54.00" rx="4.00" fill="#ffffff" stroke="#9aa3ad" stroke-width="2.00" /><rect x="1250.00" y="402.00" width="180.00" height="8.00" rx="0.00" fill="#1f2226" stroke="none" stroke-width="0.20" /><rect x="1222.2" y="317.0" width="235.6" height="22.0" rx="11.0" fill="#ffffff" stroke="#012a4a" stroke-width="1.4"/><text x="1340.0" y="332.7" font-size="13" text-anchor="middle" font-weight="800" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">우드락 눈 조각 (밑면 검은 테이프)</text><rect x="1479.6" y="269.0" width="240.8" height="22.0" rx="11.0" fill="#ffffff" stroke="#e67e22" stroke-width="1.4"/><text x="1600.0" y="284.7" font-size="13" text-anchor="middle" font-weight="800" fill="#e67e22" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">ADC raw 크게 변함 → 젖음(=눈) 참</text><rect x="40.0" y="660.0" width="1720.0" height="300.0" rx="12" fill="#f5f9fc" stroke="#c7dce8" stroke-width="1.5"/><rect x="40.0" y="660.0" width="1720.0" height="34" rx="12" fill="#014f86"/><rect x="40.0" y="680.0" width="1720.0" height="14" fill="#014f86"/><text x="56.0" y="683.0" font-size="16" text-anchor="start" font-weight="800" fill="#ffffff" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">설정과 맞추는 법 (펌웨어 수정 없음)</text><text x="70.0" y="720.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 조도 1을 기존 &#x27;젖음&#x27; 입력 GP26에 꽂는다. 펌웨어가 이미 GP26 raw를 읽고 WET_THRESHOLD로 참/거짓을 만든다.</text><text x="70.0" y="760.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 맞추기: 맑을 때 raw와 덮었을 때 raw를 @@TEL 의 wet_raw로 읽고, 가운데 값을 WET_THRESHOLD에 넣는다.</text><text x="70.0" y="800.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 덮으면 raw가 작아지는 모듈이면 WET_WHEN_LOW = True, 커지면 False. (KY-018은 배선 방향에 따라 다르다.)</text><text x="70.0" y="840.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 조도 2(선택)는 GP27, LIGHT_ENABLE = True. light_raw로 화면에만 보인다.</text><text x="70.0" y="880.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 차가 지나갈 때 그림자도 &#x27;눈&#x27;으로 읽힌다. 서버는 출동 중에는 다시 출동하지 않으니 문제없다.</text></svg>