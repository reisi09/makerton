<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 900" width="1560" height="900" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">
<title>시스템 구성</title>
<defs>
<marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#01497c"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#01497c"/></marker>
<marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#012a4a"/></marker>
<marker id="flowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a6f97"/></marker>
<marker id="flowL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a9d6e5"/></marker>
<pattern id="waves" width="40" height="18" patternUnits="userSpaceOnUse"><path d="M0 9 q10 -7 20 0 t20 0" fill="none" stroke="#468faf" stroke-width="2"/></pattern>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="12" fill="#a9d6e5"/><rect x="6" width="6" height="12" fill="#ffffff"/></pattern>
</defs>
<text x="24.0" y="46.0" font-size="34" text-anchor="start" font-weight="800" fill="#111" >고색고 ICE-ZERO 자동 제설 모형 — 시스템 구성</text><text x="24.0" y="80.0" font-size="20" text-anchor="start" font-weight="600" fill="#2a6f97" >출동은 코드 규칙이 정한다. Claude는 사진의 눈 자리 표시에만 쓴다(키 두 개가 있을 때).</text><rect x="20.0" y="110.0" width="430.0" height="250.0" rx="14" fill="#dceaf4" stroke="#012a4a" stroke-width="2.5" /><text x="235.0" y="150.0" font-size="28" text-anchor="middle" font-weight="800" fill="#012a4a" >맥북 — 모델·서버</text><text x="235.0" y="188.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >ICE-ZERO 지면온도 예보(참고용)</text><text x="235.0" y="217.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >갈래 예측 동결확률 · 상대 우선순위</text><text x="235.0" y="246.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >서버 0.0.0.0:8000 (/ · /app · /monitor)</text><text x="235.0" y="275.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >전체 청소 · 최적 경로(24가지 비교)</text><rect x="20.0" y="490.0" width="430.0" height="200.0" rx="14" fill="#cfe3f0" stroke="#012a4a" stroke-width="2.5" /><text x="235.0" y="530.0" font-size="26" text-anchor="middle" font-weight="800" fill="#012a4a" >모니터 — 웹 /monitor</text><text x="235.0" y="568.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >1920×1080 키오스크, 스크롤 없음</text><text x="235.0" y="597.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >1초 갱신 · 조작 버튼 없음</text><text x="235.0" y="626.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >같은 Wi-Fi: http://&lt;맥 IP&gt;:8000/monitor</text><rect x="610.0" y="110.0" width="340.0" height="250.0" rx="14" fill="#dceaf4" stroke="#012a4a" stroke-width="2.5" /><text x="780.0" y="150.0" font-size="26" text-anchor="middle" font-weight="800" fill="#012a4a" >기지 Pico #1</text><text x="780.0" y="188.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >관제실 · USB 시리얼(맥북 전원)</text><text x="780.0" y="217.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >DHT11×4 · 수위(W) · 조도</text><text x="780.0" y="246.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >OLED · LCD · LED · 부저 · 링</text><text x="780.0" y="275.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >도킹 감지 · 자동 보충</text><rect x="610.0" y="490.0" width="340.0" height="236.0" rx="14" fill="#cfe3f0" stroke="#012a4a" stroke-width="2.5" /><text x="780.0" y="530.0" font-size="26" text-anchor="middle" font-weight="800" fill="#012a4a" >제설차 Pico #2</text><text x="780.0" y="568.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >Wi-Fi UDP 9200 ⇄ 9201</text><text x="780.0" y="597.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >28BYJ-48 ×2 + ULN2003 ×2</text><text x="780.0" y="626.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >기지 출발 → 밀기 → 후진 귀환</text><text x="780.0" y="655.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >전원 맥 USB · 모터만 장착</text><rect x="1110.0" y="110.0" width="430.0" height="250.0" rx="14" fill="#e3eef6" stroke="#012a4a" stroke-width="2.5" /><text x="1325.0" y="150.0" font-size="26" text-anchor="middle" font-weight="800" fill="#012a4a" >사거리 보드 — 도로</text><text x="1325.0" y="188.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >검은 종이 도로 폭 약 150</text><text x="1325.0" y="217.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >A3 광장 297×420 · 임의 도로 4갈래</text><text x="1325.0" y="246.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >DHT11 기둥 4 · 젖음·조도(W)</text><rect x="1110.0" y="490.0" width="430.0" height="236.0" rx="14" fill="#e3eef6" stroke="#012a4a" stroke-width="2.5" /><text x="1325.0" y="530.0" font-size="26" text-anchor="middle" font-weight="800" fill="#012a4a" >제설기지 (북동 건물)</text><text x="1325.0" y="568.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >출입구 서쪽 면 → N 도로</text><text x="1325.0" y="597.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >차고 안 바퀴 축 (764, 250)</text><text x="1325.0" y="626.0" font-size="19" text-anchor="middle" font-weight="600" fill="#1f3b52" >서쪽 182 → 남쪽 230 → 중심</text><line x1="450.0" y1="210.0" x2="610.0" y2="210.0" stroke="#01497c" stroke-width="4" marker-start="url(#flowB)" marker-end="url(#flowB)"/><text x="530.0" y="196.0" font-size="18" text-anchor="middle" font-weight="800" fill="#01497c" >USB 시리얼</text><text x="530.0" y="244.0" font-size="15" text-anchor="middle" font-weight="700" fill="#2a6f97" >@@TEL·@@SHOW</text><line x1="950.0" y1="210.0" x2="1110.0" y2="210.0" stroke="#2a6f97" stroke-width="4" marker-end="url(#flowB)"/><text x="1030.0" y="196.0" font-size="18" text-anchor="middle" font-weight="800" fill="#2a6f97" >3V3·ADC</text><text x="1030.0" y="244.0" font-size="15" text-anchor="middle" font-weight="700" fill="#2a6f97" >신호선</text><line x1="235.0" y1="360.0" x2="235.0" y2="490.0" stroke="#01497c" stroke-width="4" marker-end="url(#flowB)"/><text x="250.0" y="412.0" font-size="17" text-anchor="start" font-weight="800" fill="#01497c" >웹 /monitor</text><text x="250.0" y="438.0" font-size="15" text-anchor="start" font-weight="700" fill="#2a6f97" >같은 Wi-Fi</text><path d="M 450 320 L 545 320 L 545 600 L 610 600" fill="none" stroke="#01497c" stroke-width="4" /><path d="M 610 600 l -14 -7 l 0 14 z" fill="#01497c"/><path d="M 545 320 l -7 14 l 14 0 z" fill="#01497c"/><text x="537.0" y="430.0" font-size="17" text-anchor="end" font-weight="800" fill="#01497c" >Wi-Fi UDP</text><text x="537.0" y="455.0" font-size="15" text-anchor="end" font-weight="700" fill="#2a6f97" >9200 ⇄ 9201</text><line x1="950.0" y1="600.0" x2="1110.0" y2="600.0" stroke="#2a6f97" stroke-width="4" marker-end="url(#flowB)"/><text x="1030.0" y="586.0" font-size="18" text-anchor="middle" font-weight="800" fill="#2a6f97" >모터</text><text x="1030.0" y="634.0" font-size="15" text-anchor="middle" font-weight="700" fill="#2a6f97" >차 위치</text><rect x="20.0" y="756.0" width="1520.0" height="76.0" rx="10" fill="#f2f8fc" stroke="#61a5c2" stroke-width="1.5" /><text x="40.0" y="790.0" font-size="18" text-anchor="start" font-weight="700" fill="#012a4a" >전체 청소(또는 사진 판정 API·기지 조도) + 차 idle + 실행 중 계획 없음 → 서버가 plan을 보낸다. 예보는 참고용.</text><text x="40.0" y="816.0" font-size="17" text-anchor="start" font-weight="700" fill="#012a4a" >기지 출발 → 갈래 끝까지 밀기 → 같은 길 후진 → 차고로 후진. 대시보드·패드 정지가 항상 우선하고, 신호가 5초 끊기면 선다.</text><text x="1520.0" y="872.0" font-size="16" text-anchor="end" font-weight="600" fill="#468faf" >CONTRACT.md 1·5~8절</text></svg>