<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" width="1800" height="1000" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif"><title>병뚜껑 바퀴</title><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="30" text-anchor="start" font-weight="900" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">병뚜껑 바퀴 만들기 — 앞 2개(모터) · 뒤 2개(꼬치)</text><text x="42.0" y="82.0" font-size="15" text-anchor="start" font-weight="600" fill="#014f86" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">뚜껑 지름 약 30mm → 속도 약 19mm/s. WHEEL_D_MM에 고무줄 포함 실측 지름을 넣는다.</text><rect x="40.0" y="110.0" width="560.0" height="860.0" rx="12" fill="#f5f9fc" stroke="#c7dce8" stroke-width="1.5"/><rect x="40.0" y="110.0" width="560.0" height="34" rx="12" fill="#014f86"/><rect x="40.0" y="130.0" width="560.0" height="14" fill="#014f86"/><text x="56.0" y="133.0" font-size="16" text-anchor="start" font-weight="800" fill="#ffffff" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">A. 앞바퀴: 모터 축에 바로</text><g transform="translate(170.00 180.00) scale(9.0000)"><circle cx="16.00" cy="16.00" r="16.00" fill="#1f2226" stroke="none" stroke-width="0.20" /><circle cx="16.00" cy="16.00" r="14.20" fill="#f4f6f8" stroke="#c8cdd3" stroke-width="0.30" /><line x1="27.50" y1="16.00" x2="30.00" y2="16.00" stroke="#d5dade" stroke-width="0.60" /><line x1="26.81" y1="19.93" x2="29.16" y2="20.79" stroke="#d5dade" stroke-width="0.60" /><line x1="24.81" y1="23.39" x2="26.72" y2="25.00" stroke="#d5dade" stroke-width="0.60" /><line x1="21.75" y1="25.96" x2="23.00" y2="28.12" stroke="#d5dade" stroke-width="0.60" /><line x1="18.00" y1="27.33" x2="18.43" y2="29.79" stroke="#d5dade" stroke-width="0.60" /><line x1="14.00" y1="27.33" x2="13.57" y2="29.79" stroke="#d5dade" stroke-width="0.60" /><line x1="10.25" y1="25.96" x2="9.00" y2="28.12" stroke="#d5dade" stroke-width="0.60" /><line x1="7.19" y1="23.39" x2="5.28" y2="25.00" stroke="#d5dade" stroke-width="0.60" /><line x1="5.19" y1="19.93" x2="2.84" y2="20.79" stroke="#d5dade" stroke-width="0.60" /><line x1="4.50" y1="16.00" x2="2.00" y2="16.00" stroke="#d5dade" stroke-width="0.60" /><line x1="5.19" y1="12.07" x2="2.84" y2="11.21" stroke="#d5dade" stroke-width="0.60" /><line x1="7.19" y1="8.61" x2="5.28" y2="7.00" stroke="#d5dade" stroke-width="0.60" /><line x1="10.25" y1="6.04" x2="9.00" y2="3.88" stroke="#d5dade" stroke-width="0.60" /><line x1="14.00" y1="4.67" x2="13.57" y2="2.21" stroke="#d5dade" stroke-width="0.60" /><line x1="18.00" y1="4.67" x2="18.43" y2="2.21" stroke="#d5dade" stroke-width="0.60" /><line x1="21.75" y1="6.04" x2="23.00" y2="3.88" stroke="#d5dade" stroke-width="0.60" /><line x1="24.81" y1="8.61" x2="26.72" y2="7.00" stroke="#d5dade" stroke-width="0.60" /><line x1="26.81" y1="12.07" x2="29.16" y2="11.21" stroke="#d5dade" stroke-width="0.60" /><circle cx="16.00" cy="16.00" r="3.00" fill="#cfd5db" stroke="#8f969f" stroke-width="0.30" /><rect x="13.50" y="14.50" width="5.00" height="3.00" rx="0.00" fill="#ffffff" stroke="#8f969f" stroke-width="0.20" /></g><text x="70.0" y="520.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">1. 뚜껑 정중앙을 찾는다(사출 자국 점).</text><text x="70.0" y="554.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">2. 송곳으로 축(Ø5)보다 조금 작게 뚫는다.</text><text x="70.0" y="588.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">3. 축을 끝까지 눌러 끼우고 글루건.</text><text x="70.0" y="622.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">4. 굳기 전에 뚜껑이 축과 직각인지 본다.</text><text x="70.0" y="656.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">5. 둘레에 고무줄·절연테이프 1바퀴.</text><text x="70.0" y="690.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">   (우드락 위에서 덜 미끄러진다)</text><rect x="620.0" y="110.0" width="560.0" height="860.0" rx="12" fill="#f5f9fc" stroke="#c7dce8" stroke-width="1.5"/><rect x="620.0" y="110.0" width="560.0" height="34" rx="12" fill="#014f86"/><rect x="620.0" y="130.0" width="560.0" height="14" fill="#014f86"/><text x="636.0" y="133.0" font-size="16" text-anchor="start" font-weight="800" fill="#ffffff" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">B. 뒷바퀴: 꼬치 + 빨대</text><rect x="750.00" y="318.00" width="300.00" height="24.00" rx="12.00" fill="#f2f2f2" stroke="#9aa3ad" stroke-width="2.00" /><line x1="680.00" y1="330.00" x2="1120.00" y2="330.00" stroke="#c79a55" stroke-width="6.00" /><rect x="680.00" y="255.00" width="40.00" height="150.00" rx="6.00" fill="#2f6fd6" stroke="#1d4b96" stroke-width="2.00" /><rect x="1080.00" y="255.00" width="40.00" height="150.00" rx="6.00" fill="#2f6fd6" stroke="#1d4b96" stroke-width="2.00" /><rect x="816.0" y="269.0" width="168.0" height="22.0" rx="11.0" fill="#ffffff" stroke="#012a4a" stroke-width="1.4"/><text x="900.0" y="284.7" font-size="13" text-anchor="middle" font-weight="800" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">빨대 (하판 밑에 글루건)</text><rect x="816.0" y="429.0" width="168.0" height="22.0" rx="11.0" fill="#ffffff" stroke="#012a4a" stroke-width="1.4"/><text x="900.0" y="444.7" font-size="13" text-anchor="middle" font-weight="800" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">꼬치 (빨대 안에서 돈다)</text><rect x="681.0" y="219.0" width="38.0" height="22.0" rx="11.0" fill="#ffffff" stroke="#012a4a" stroke-width="1.4"/><text x="700.0" y="234.7" font-size="13" text-anchor="middle" font-weight="800" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">뚜껑</text><rect x="1081.0" y="219.0" width="38.0" height="22.0" rx="11.0" fill="#ffffff" stroke="#012a4a" stroke-width="1.4"/><text x="1100.0" y="234.7" font-size="13" text-anchor="middle" font-weight="800" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">뚜껑</text><text x="650.0" y="520.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">1. 빨대를 하판 폭보다 조금 짧게(약 74) 자른다.</text><text x="650.0" y="554.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">2. 꼬치를 빨대에 넣고 양 끝에 뚜껑을 글루건.</text><text x="650.0" y="588.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">3. 꼬치는 빨대 밖으로 양쪽 약 15씩 나오게.</text><text x="650.0" y="622.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">4. 빨대 위에 우드락 22mm를 쌓아 하판에 붙임.</text><text x="650.0" y="656.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">5. 손으로 굴려 걸림 없이 도는지 확인.</text><text x="650.0" y="690.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 빨대에 글루가 들어가면 꼬치가 안 돈다</text><rect x="1200.0" y="110.0" width="560.0" height="860.0" rx="12" fill="#f5f9fc" stroke="#c7dce8" stroke-width="1.5"/><rect x="1200.0" y="110.0" width="560.0" height="34" rx="12" fill="#014f86"/><rect x="1200.0" y="130.0" width="560.0" height="14" fill="#014f86"/><text x="1216.0" y="133.0" font-size="16" text-anchor="start" font-weight="800" fill="#ffffff" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">C. 모터 방향 (중요)</text><line x1="1220.00" y1="474.00" x2="1440.00" y2="474.00" stroke="#475569" stroke-width="2.00" /><circle cx="1330.00" cy="391.20" r="50.40" fill="#c2c8cf" stroke="#7f878f" stroke-width="1.50" /><circle cx="1330.00" cy="420.00" r="54.00" fill="#2f6fd6" stroke="#1d4b96" stroke-width="1.50" fill-opacity="0.75"/><circle cx="1330.00" cy="420.00" r="8.00" fill="#dfe4e9" stroke="#8f969f" stroke-width="1.00" /><rect x="1247.3" y="519.0" width="165.4" height="22.0" rx="11.0" fill="#ffffff" stroke="#2c7da0" stroke-width="1.4"/><text x="1330.0" y="534.7" font-size="13" text-anchor="middle" font-weight="800" fill="#2c7da0" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">축 아래 · 몸통 위 → 됨</text><line x1="1500.00" y1="474.00" x2="1720.00" y2="474.00" stroke="#475569" stroke-width="2.00" /><circle cx="1610.00" cy="448.80" r="50.40" fill="#c2c8cf" stroke="#7f878f" stroke-width="1.50" /><circle cx="1610.00" cy="420.00" r="54.00" fill="#2f6fd6" stroke="#1d4b96" stroke-width="1.50" fill-opacity="0.75"/><circle cx="1610.00" cy="420.00" r="8.00" fill="#dfe4e9" stroke="#8f969f" stroke-width="1.00" /><rect x="1503.9" y="519.0" width="212.2" height="22.0" rx="11.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="1610.0" y="534.7" font-size="13" text-anchor="middle" font-weight="800" fill="#c0392b" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">축 위 · 몸통 아래 → 바닥 닿음</text><path d="M 1580.0 460.0 L 1640.0 520.0 M 1640.0 460.0 L 1580.0 520.0" fill="none" stroke="#c0392b" stroke-width="5.00" /><text x="1230.0" y="620.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 28BYJ-48 축은 몸통 중심에서 8mm 비켜 있다.</text><text x="1230.0" y="654.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 뚜껑 반지름 15 &lt; 몸통이 축 아래로 나오는 22</text><text x="1230.0" y="688.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">  → 축이 위면 몸통이 바닥을 긁는다.</text><text x="1230.0" y="722.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 축이 아래로 오게 돌려 몸통 위를 하판에 붙인다.</text><text x="1230.0" y="756.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 이때 하판 밑 높이 = 15 + 8 + 14 = 37mm.</text></svg>