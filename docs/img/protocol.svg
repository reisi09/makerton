<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1060" width="1560" height="1060" font-family="Helvetica, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<title>UDP 프로토콜 순서</title>
<defs>
<marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#01497c"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#01497c"/></marker>
<marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#012a4a"/></marker>
<marker id="flowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a6f97"/></marker>
<marker id="flowL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a9d6e5"/></marker>
<pattern id="waves" width="40" height="18" patternUnits="userSpaceOnUse"><path d="M0 9 q10 -7 20 0 t20 0" fill="none" stroke="#468faf" stroke-width="2"/></pattern>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="12" fill="#a9d6e5"/><rect x="6" width="6" height="12" fill="#ffffff"/></pattern>
</defs>
<text x="24.0" y="44.0" font-size="32" text-anchor="start" font-weight="800" fill="#111" >UDP 프로토콜 — 서버(맥북) ⇄ 제설차 Pico #2</text><text x="24.0" y="76.0" font-size="19" text-anchor="start" font-weight="600" fill="#2a6f97" >한 줄 = 한 데이터그램(JSON). 서버 9200 수신, 차 9201 수신.</text><rect x="280.0" y="110.0" width="300.0" height="80.0" rx="10" fill="#cfe3f0" stroke="#012a4a" stroke-width="2.5" /><text x="430.0" y="148.0" font-size="26" text-anchor="middle" font-weight="800" fill="#012a4a" >서버</text><text x="430.0" y="176.0" font-size="15" text-anchor="middle" font-weight="600" fill="#01497c" >맥북 0.0.0.0:9200</text><line x1="430.0" y1="195.0" x2="430.0" y2="930.0" stroke="#61a5c2" stroke-width="2" stroke-dasharray="9 8" /><rect x="930.0" y="110.0" width="300.0" height="80.0" rx="10" fill="#cfe3f0" stroke="#012a4a" stroke-width="2.5" /><text x="1080.0" y="148.0" font-size="26" text-anchor="middle" font-weight="800" fill="#012a4a" >제설차</text><text x="1080.0" y="176.0" font-size="15" text-anchor="middle" font-weight="600" fill="#01497c" >Pico #2 :9201</text><line x1="1080.0" y1="195.0" x2="1080.0" y2="930.0" stroke="#61a5c2" stroke-width="2" stroke-dasharray="9 8" /><line x1="60.0" y1="200.0" x2="60.0" y2="930.0" stroke="#61a5c2" stroke-width="2" marker-end="url(#flowB)"/><text x="46.0" y="560.0" font-size="18" text-anchor="middle" font-weight="800" fill="#2a6f97" transform="rotate(-90 46 560)">시간</text><line x1="1080.0" y1="250.0" x2="430.0" y2="250.0" stroke="#012a4a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#flow)"/><text x="755.0" y="238.0" font-size="20" text-anchor="middle" font-weight="800" fill="#012a4a" >hello {id:&quot;car1&quot;}</text><text x="755.0" y="276.0" font-size="15" text-anchor="middle" font-weight="600" fill="#01497c" >부팅 시 브로드캐스트(SERVER_IP 비면)</text><line x1="430.0" y1="330.0" x2="1080.0" y2="330.0" stroke="#012a4a" stroke-width="3" marker-end="url(#flow)"/><text x="755.0" y="318.0" font-size="20" text-anchor="middle" font-weight="800" fill="#012a4a" >plan {seq, order:[…]}</text><text x="755.0" y="356.0" font-size="15" text-anchor="middle" font-weight="600" fill="#01497c" >실행 중이면 거절</text><line x1="1080.0" y1="400.0" x2="430.0" y2="400.0" stroke="#012a4a" stroke-width="3" marker-end="url(#flow)"/><text x="755.0" y="388.0" font-size="20" text-anchor="middle" font-weight="800" fill="#012a4a" >ack {seq, ok}</text><text x="755.0" y="426.0" font-size="15" text-anchor="middle" font-weight="600" fill="#01497c" >같은 seq는 한 번만 실행</text><line x1="1080.0" y1="470.0" x2="430.0" y2="470.0" stroke="#012a4a" stroke-width="3" marker-end="url(#flow)"/><text x="755.0" y="458.0" font-size="20" text-anchor="middle" font-weight="800" fill="#012a4a" >evt plan_start · arm_start</text><text x="755.0" y="496.0" font-size="15" text-anchor="middle" font-weight="600" fill="#01497c" >갈래 시작</text><line x1="1080.0" y1="540.0" x2="430.0" y2="540.0" stroke="#012a4a" stroke-width="3" marker-end="url(#flow)"/><text x="755.0" y="528.0" font-size="20" text-anchor="middle" font-weight="800" fill="#012a4a" >evt spray_on · spray_off · arm_done</text><text x="755.0" y="566.0" font-size="15" text-anchor="middle" font-weight="600" fill="#01497c" >살포 구간 110~340mm</text><line x1="1080.0" y1="620.0" x2="430.0" y2="620.0" stroke="#014f86" stroke-width="3" marker-end="url(#flowB)"/><text x="755.0" y="608.0" font-size="20" text-anchor="middle" font-weight="800" fill="#014f86" >tel 500ms</text><text x="755.0" y="646.0" font-size="15" text-anchor="middle" font-weight="600" fill="#01497c" >{state, arm, phase, x, y, h, spray, obst_cm}</text><line x1="430.0" y1="710.0" x2="1080.0" y2="710.0" stroke="#012a4a" stroke-width="3" marker-end="url(#flow)"/><text x="755.0" y="698.0" font-size="20" text-anchor="middle" font-weight="800" fill="#012a4a" >stop</text><text x="755.0" y="736.0" font-size="15" text-anchor="middle" font-weight="600" fill="#01497c" >비상 정지 · 자동 끔</text><line x1="1080.0" y1="780.0" x2="430.0" y2="780.0" stroke="#014f86" stroke-width="3" marker-end="url(#flowB)"/><text x="755.0" y="768.0" font-size="20" text-anchor="middle" font-weight="800" fill="#014f86" >evt stopped</text><text x="755.0" y="806.0" font-size="15" text-anchor="middle" font-weight="600" fill="#01497c" >코일 OFF · 서보 닫힘</text><line x1="430.0" y1="850.0" x2="1080.0" y2="850.0" stroke="#012a4a" stroke-width="3" marker-end="url(#flow)"/><text x="755.0" y="838.0" font-size="20" text-anchor="middle" font-weight="800" fill="#012a4a" >home</text><text x="755.0" y="876.0" font-size="15" text-anchor="middle" font-weight="600" fill="#01497c" >추측 위치로 중심 복귀</text><line x1="1080.0" y1="920.0" x2="430.0" y2="920.0" stroke="#014f86" stroke-width="3" marker-end="url(#flowB)"/><text x="755.0" y="908.0" font-size="20" text-anchor="middle" font-weight="800" fill="#014f86" >evt plan_done · tel idle</text><text x="755.0" y="946.0" font-size="15" text-anchor="middle" font-weight="600" fill="#01497c" >계획 종료</text><rect x="1170.0" y="220.0" width="360.0" height="300.0" rx="12" fill="#f4f8fb" stroke="#61a5c2" stroke-width="2" /><text x="1194.0" y="256.0" font-size="22" text-anchor="start" font-weight="800" fill="#012a4a" >규칙</text><text x="1194.0" y="292.0" font-size="16" text-anchor="start" font-weight="600" fill="#1f3b52" >· tel 500ms 주기(끊김 감시)</text><text x="1194.0" y="328.0" font-size="16" text-anchor="start" font-weight="600" fill="#1f3b52" >· 5초 무패킷 → pause</text><text x="1194.0" y="364.0" font-size="16" text-anchor="start" font-weight="600" fill="#1f3b52" >· 패킷 오면 재개</text><text x="1194.0" y="400.0" font-size="16" text-anchor="start" font-weight="600" fill="#1f3b52" >· obst &lt; 8cm → 정지</text><text x="1194.0" y="436.0" font-size="16" text-anchor="start" font-weight="600" fill="#1f3b52" >· 1초 비면 재개 · 10초 aborted</text><text x="1194.0" y="472.0" font-size="16" text-anchor="start" font-weight="600" fill="#1f3b52" >· stop/home은 언제나 받는다</text><text x="24.0" y="1014.0" font-size="17" text-anchor="start" font-weight="700" fill="#012a4a" >ack는 받은 seq를 되돌려 준다. 서버는 ack ok=false면 계획을 접고 이벤트에 남긴다.</text><text x="24.0" y="1042.0" font-size="17" text-anchor="start" font-weight="600" fill="#2a6f97" >차가 없거나 링크가 끊기면 서버는 &#x27;모의 실행&#x27;으로 갈래당 3초 뒤 완료 처리한다.</text></svg>