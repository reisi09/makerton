<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" width="1800" height="1000" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif"><title>차 전원</title><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="30" text-anchor="start" font-weight="900" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">차 전원 — 둘 중 하나</text><text x="42.0" y="82.0" font-size="15" text-anchor="start" font-weight="600" fill="#014f86" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">차는 광장 안에서만 45cm 오간다. 유선이 특히 쉽다. 어느 쪽이든 회로는 같다(Pico 마이크로 USB로 5V).</text><rect x="40.0" y="110.0" width="820.0" height="850.0" rx="12" fill="#f5f9fc" stroke="#c7dce8" stroke-width="1.5"/><rect x="40.0" y="110.0" width="820.0" height="34" rx="12" fill="#014f86"/><rect x="40.0" y="130.0" width="820.0" height="14" fill="#014f86"/><text x="56.0" y="133.0" font-size="16" text-anchor="start" font-weight="800" fill="#ffffff" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">A. 보조배터리를 차에 싣기</text><g transform="translate(140.00 190.00) scale(3.0000)"><rect x="0.00" y="0.00" width="90.00" height="120.00" rx="2.00" fill="#f3f1ea" stroke="#c9c4b4" stroke-width="0.50" /><line x1="0.00" y1="20.00" x2="90.00" y2="20.00" stroke="#e6e2d6" stroke-width="0.30" /><line x1="0.00" y1="40.00" x2="90.00" y2="40.00" stroke="#e6e2d6" stroke-width="0.30" /><line x1="0.00" y1="60.00" x2="90.00" y2="60.00" stroke="#e6e2d6" stroke-width="0.30" /><line x1="0.00" y1="80.00" x2="90.00" y2="80.00" stroke="#e6e2d6" stroke-width="0.30" /><line x1="0.00" y1="100.00" x2="90.00" y2="100.00" stroke="#e6e2d6" stroke-width="0.30" /></g><g transform="translate(140.00 307.00) scale(3.0000)"><rect x="0.00" y="0.00" width="90.00" height="60.00" rx="6.00" fill="#2d3238" stroke="#15181b" stroke-width="0.50" /><rect x="2.50" y="2.50" width="85.00" height="55.00" rx="5.00" fill="#3a4047" stroke="none" stroke-width="0.20" /><text x="40.00" y="27.00" font-size="7.00" text-anchor="middle" font-weight="800" fill="#d6dbe0" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">5,000mAh</text><text x="40.00" y="37.00" font-size="4.60" text-anchor="middle" font-weight="700" fill="#a9b1b9" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">5V 2A 출력</text><circle cx="26.00" cy="47.00" r="1.40" fill="#7fd1ff" stroke="none" stroke-width="0.20" /><circle cx="35.00" cy="47.00" r="1.40" fill="#7fd1ff" stroke="none" stroke-width="0.20" /><circle cx="44.00" cy="47.00" r="1.40" fill="#7fd1ff" stroke="none" stroke-width="0.20" /><circle cx="53.00" cy="47.00" r="1.40" fill="#55606b" stroke="none" stroke-width="0.20" /><rect x="84.50" y="23.00" width="5.50" height="14.00" rx="0.80" fill="#15181b" stroke="#000" stroke-width="0.30" /><rect x="85.40" y="25.00" width="3.00" height="10.00" rx="0.50" fill="#7a8088" stroke="none" stroke-width="0.20" /></g><text x="470.0" y="220.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 5,000mAh 슬림형, 5V 2A 출력</text><text x="470.0" y="254.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 편의점·다이소에서 구매</text><text x="470.0" y="288.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 앞·뒤 축 사이에 싣는다</text><text x="470.0" y="322.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 대기 중 저절로 꺼질 수 있다</text><text x="470.0" y="356.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">  → 출동 직전 버튼을 한 번 누른다</text><rect x="880.0" y="110.0" width="880.0" height="850.0" rx="12" fill="#f5f9fc" stroke="#c7dce8" stroke-width="1.5"/><rect x="880.0" y="110.0" width="880.0" height="34" rx="12" fill="#014f86"/><rect x="880.0" y="130.0" width="880.0" height="14" fill="#014f86"/><text x="896.0" y="133.0" font-size="16" text-anchor="start" font-weight="800" fill="#ffffff" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">B. 유선: 광장 위 막대에서 1m USB를 내린다</text><line x1="924.00" y1="640.00" x2="1716.00" y2="640.00" stroke="#475569" stroke-width="3.00" /><rect x="1023.00" y="632.00" width="594.00" height="8.00" rx="0.00" fill="#f3f1ea" stroke="#c9c4b4" stroke-width="1.00" /><rect x="924.00" y="595.00" width="72.00" height="45.00" rx="2.00" fill="#2a6f97" stroke="#012a4a" stroke-width="0.80" /><rect x="924.00" y="550.00" width="72.00" height="45.00" rx="2.00" fill="#468faf" stroke="#012a4a" stroke-width="0.80" /><rect x="924.00" y="505.00" width="72.00" height="45.00" rx="2.00" fill="#61a5c2" stroke="#012a4a" stroke-width="0.80" /><rect x="924.00" y="460.00" width="72.00" height="45.00" rx="2.00" fill="#2a6f97" stroke="#012a4a" stroke-width="0.80" /><rect x="924.00" y="415.00" width="72.00" height="45.00" rx="2.00" fill="#468faf" stroke="#012a4a" stroke-width="0.80" /><rect x="924.00" y="370.00" width="72.00" height="45.00" rx="2.00" fill="#61a5c2" stroke="#012a4a" stroke-width="0.80" /><rect x="1644.00" y="595.00" width="72.00" height="45.00" rx="2.00" fill="#2a6f97" stroke="#012a4a" stroke-width="0.80" /><rect x="1644.00" y="550.00" width="72.00" height="45.00" rx="2.00" fill="#468faf" stroke="#012a4a" stroke-width="0.80" /><rect x="1644.00" y="505.00" width="72.00" height="45.00" rx="2.00" fill="#61a5c2" stroke="#012a4a" stroke-width="0.80" /><rect x="1644.00" y="460.00" width="72.00" height="45.00" rx="2.00" fill="#2a6f97" stroke="#012a4a" stroke-width="0.80" /><rect x="1644.00" y="415.00" width="72.00" height="45.00" rx="2.00" fill="#468faf" stroke="#012a4a" stroke-width="0.80" /><rect x="1644.00" y="370.00" width="72.00" height="45.00" rx="2.00" fill="#61a5c2" stroke="#012a4a" stroke-width="0.80" /><rect x="933.00" y="358.00" width="774.00" height="12.00" rx="3.00" fill="#b08850" stroke="#7a5a2a" stroke-width="1.00" /><text x="933.0" y="346.0" font-size="14" text-anchor="start" font-weight="800" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">막대 높이 30cm · 판 밖 책 더미 위</text><g transform="translate(1290.00 268.00) scale(2.0000)"><rect x="0.00" y="0.00" width="30.00" height="45.00" rx="2.40" fill="#f2f3f4" stroke="#c9ccd1" stroke-width="0.35" /><rect x="2.00" y="2.00" width="26.00" height="41.00" rx="1.80" fill="#fbfbfc" stroke="none" stroke-width="0.20" /><text x="15.00" y="15.00" font-size="4.20" text-anchor="middle" font-weight="800" fill="#8b9098" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">5V</text><text x="15.00" y="21.00" font-size="3.00" text-anchor="middle" font-weight="700" fill="#a8adb4" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">2A</text><rect x="8.20" y="36.80" width="13.60" height="7.40" rx="0.60" fill="#20242a" stroke="#0b0d10" stroke-width="0.25" /><rect x="9.60" y="38.00" width="10.80" height="3.20" rx="0.40" fill="#6b7078" stroke="none" stroke-width="0.20" /></g><rect x="1387.8" y="289.0" width="204.4" height="22.0" rx="11.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="1490.0" y="304.7" font-size="13" text-anchor="middle" font-weight="800" fill="#c0392b" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">멀티탭+충전기를 막대 가운데에</text><path d="M 1320.0 370.0 Q 1243.5 592.0 1167.0 592.0" fill="none" stroke="#1a1a1a" stroke-width="5"/><rect x="1127.00" y="592.00" width="80.00" height="32.00" rx="4.00" fill="#e9dfc6" stroke="#9aa3ad" stroke-width="1.00" /><rect x="1118.1" y="551.0" width="97.8" height="22.0" rx="11.0" fill="#ffffff" stroke="#012a4a" stroke-width="1.4"/><text x="1167.0" y="566.7" font-size="13" text-anchor="middle" font-weight="800" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">북쪽 끝 34cm</text><path d="M 1320.0 370.0 Q 1432.5 592.0 1545.0 592.0" fill="none" stroke="#1a1a1a" stroke-width="5"/><rect x="1505.00" y="592.00" width="80.00" height="32.00" rx="4.00" fill="#e9dfc6" stroke="#9aa3ad" stroke-width="1.00" /><rect x="1496.1" y="551.0" width="97.8" height="22.0" rx="11.0" fill="#ffffff" stroke="#012a4a" stroke-width="1.4"/><text x="1545.0" y="566.7" font-size="13" text-anchor="middle" font-weight="800" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">대기 칸 39cm</text><text x="1320.0" y="670.0" font-size="13" text-anchor="middle" font-weight="700" fill="#64748b" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">남 ← 광장 → 북 (단면)</text><text x="910.0" y="740.0" font-size="15" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 가장 먼 곳이 대기 칸 39cm → 1m 케이블로 넉넉하다.</text><text x="910.0" y="774.0" font-size="15" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 직진·후진만 하니 케이블이 꼬이지 않는다.</text><text x="910.0" y="808.0" font-size="15" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 처지는 길이를 맞춰 바퀴·날에 안 걸리게 한다.</text><text x="910.0" y="842.0" font-size="15" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 맥북 USB-C로 주면 재부팅될 수 있다 → STEP_US 1500.</text></svg>