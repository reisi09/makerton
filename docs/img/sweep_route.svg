<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1060" width="1800" height="1060" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif"><title>사거리와 주행</title><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="52.0" font-size="30" text-anchor="start" font-weight="900" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">사거리와 주행 — 직선 한 번 밀고 후진</text><text x="42.0" y="82.0" font-size="15" text-anchor="start" font-weight="600" fill="#014f86" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">광장 297×420 안만 청소한다. 회전 없음. 치수는 사진 추정(mm)이라 실측해서 config에 넣는다.</text><rect x="57.50" y="130.00" width="825.00" height="800.00" rx="0.00" fill="#ffffff" stroke="#94a3b8" stroke-width="2.00" /><rect x="57.50" y="411.25" width="825.00" height="187.50" rx="0.00" fill="#1f2226" stroke="none" stroke-width="0.20" /><rect x="376.25" y="130.00" width="187.50" height="800.00" rx="0.00" fill="#1f2226" stroke="none" stroke-width="0.20" /><rect x="273.75" y="201.25" width="371.25" height="525.00" rx="0.00" fill="#2a2e33" stroke="#e67e22" stroke-width="3.00" /><rect x="378.2" y="156.5" width="183.6" height="22.0" rx="11.0" fill="#ffffff" stroke="#e67e22" stroke-width="1.4"/><text x="470.0" y="172.2" font-size="13" text-anchor="middle" font-weight="800" fill="#e67e22" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">청소 구역 = 광장 297×420</text><text x="470.0" y="155.8" font-size="20" text-anchor="middle" font-weight="900" fill="#ffffff" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">N</text><text x="845.0" y="512.0" font-size="20" text-anchor="middle" font-weight="900" fill="#ffffff" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">E</text><text x="95.0" y="512.0" font-size="20" text-anchor="middle" font-weight="900" fill="#ffffff" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">W</text><text x="470.0" y="912.0" font-size="20" text-anchor="middle" font-weight="900" fill="#ffffff" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">S</text><rect x="387.50" y="186.25" width="165.00" height="625.00" rx="0.00" fill="#2c7da0" stroke="none" stroke-width="0.20" fill-opacity="0.18"/><rect x="413.75" y="742.50" width="112.50" height="150.00" rx="6.00" fill="#e9dfc6" stroke="#9aa3ad" stroke-width="1.50" /><text x="470.0" y="823.8" font-size="16" text-anchor="middle" font-weight="900" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">차</text><rect x="382.5" y="717.5" width="175.0" height="200.0" fill="none" stroke="#e67e22" stroke-width="3" stroke-dasharray="12 7"/><rect x="608.6" y="869.5" width="112.8" height="21.0" rx="10.5" fill="#ffffff" stroke="#e67e22" stroke-width="1.4"/><text x="665.0" y="884.3" font-size="12" text-anchor="middle" font-weight="800" fill="#e67e22" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">대기 칸 (테이프)</text><line x1="442.5" y1="730.0" x2="442.5" y2="305.9" stroke="#2c7da0" stroke-width="6.0" stroke-linecap="round"/><path d="M 442.5 298.8 L 447.4 309.7 L 437.6 309.7 Z" fill="#2c7da0"/><rect x="261.5" y="554.0" width="142.0" height="22.0" rx="11.0" fill="#ffffff" stroke="#2c7da0" stroke-width="1.4"/><text x="332.5" y="569.7" font-size="13" text-anchor="middle" font-weight="800" fill="#2c7da0" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">1. 전진 420 (밀기)</text><line x1="497.5" y1="298.8" x2="497.5" y2="722.8" stroke="#475569" stroke-width="5.0" stroke-linecap="round" stroke-dasharray="12 8"/><path d="M 497.5 730.0 L 492.6 719.0 L 502.4 719.0 Z" fill="#475569"/><rect x="536.5" y="554.0" width="142.0" height="22.0" rx="11.0" fill="#ffffff" stroke="#475569" stroke-width="1.4"/><text x="607.5" y="569.7" font-size="13" text-anchor="middle" font-weight="800" fill="#475569" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">2. 후진 420 (복귀)</text><circle cx="470.00" cy="505.00" r="10.00" fill="#f2c230" stroke="#8a6d00" stroke-width="2.00" /><rect x="450.00" y="485.00" width="40.00" height="40.00" rx="0.00" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.50" fill-opacity="0.85"/><rect x="537.2" y="494.5" width="165.6" height="21.0" rx="10.5" fill="#ffffff" stroke="#012a4a" stroke-width="1.4"/><text x="620.0" y="509.3" font-size="12" text-anchor="middle" font-weight="800" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">조도 1 (GP26) + 눈 조각</text><circle cx="470.00" cy="355.00" r="10.00" fill="#f2c230" stroke="#8a6d00" stroke-width="2.00" /><rect x="450.00" y="335.00" width="40.00" height="40.00" rx="0.00" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.50" fill-opacity="0.85"/><rect x="518.0" y="344.5" width="204.0" height="21.0" rx="10.5" fill="#ffffff" stroke="#012a4a" stroke-width="1.4"/><text x="620.0" y="359.3" font-size="12" text-anchor="middle" font-weight="800" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">조도 2 (GP27, 선택) + 눈 조각</text><circle cx="195.00" cy="680.00" r="11.00" fill="#f2c230" stroke="#8a6d00" stroke-width="2.00" /><rect x="171.0" y="697.5" width="48.0" height="21.0" rx="10.5" fill="#ffffff" stroke="#012a4a" stroke-width="1.4"/><text x="195.0" y="712.3" font-size="12" text-anchor="middle" font-weight="800" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">DHT11</text><rect x="1060.0" y="120.0" width="700.0" height="900.0" rx="12" fill="#f5f9fc" stroke="#c7dce8" stroke-width="1.5"/><rect x="1060.0" y="120.0" width="700.0" height="34" rx="12" fill="#014f86"/><rect x="1060.0" y="140.0" width="700.0" height="14" fill="#014f86"/><text x="1076.0" y="143.0" font-size="16" text-anchor="start" font-weight="800" fill="#ffffff" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">주행 규칙과 실측</text><text x="1086.0" y="190.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 출동 1번 = 전진 420 → 후진 420. 약 45초.</text><text x="1086.0" y="224.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 기존 펌웨어 경로를 그대로 쓴다: order [&quot;N&quot;]</text><text x="1086.0" y="258.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">    BASE_DIST_MM 250 (대기 → 중심)</text><text x="1086.0" y="292.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">    ARM_OUT_MM N 170 (중심 → 북쪽 멈춤)</text><text x="1086.0" y="326.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">    북쪽으로 돌 일이 없어 회전은 0°</text><text x="1086.0" y="360.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 날 폭(약 13cm) 안의 눈만 밀린다.</text><text x="1086.0" y="394.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">    눈 조각은 파란 띠 안에, 센서 위에 둔다.</text><text x="1086.0" y="428.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">· 날 끝이 광장 북쪽 끝을 약 1cm 넘어간다.</text><text x="1086.0" y="462.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">    밀린 조각은 북쪽 도로로 나간다.</text><text x="1086.0" y="496.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif"></text><text x="1086.0" y="530.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">실측해서 넣을 값</text><text x="1086.0" y="564.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">    대기 칸 차 중심 → 교차로 중심 (BASE_DIST_MM)</text><text x="1086.0" y="598.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">    중심 → 광장 북쪽 끝 − 차 앞 60 − 날 25</text><text x="1086.0" y="632.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">        → ARM_OUT_MM[&quot;N&quot;]</text><text x="1086.0" y="666.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">    뚜껑 지름 (WHEEL_D_MM)</text><text x="1086.0" y="700.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif"></text><text x="1086.0" y="734.0" font-size="16" text-anchor="start" font-weight="600" fill="#012a4a" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">출동 사이에 차가 칸에서 벗어나면 손으로 놓는다.</text></svg>