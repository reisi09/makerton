<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1000" width="1560" height="1000" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif">
<title>제설차 상태기계</title>
<defs>
<marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#01497c"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#01497c"/></marker>
<marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#012a4a"/></marker>
<marker id="flowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a6f97"/></marker>
<marker id="flowL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a9d6e5"/></marker>
<pattern id="waves" width="40" height="18" patternUnits="userSpaceOnUse"><path d="M0 9 q10 -7 20 0 t20 0" fill="none" stroke="#468faf" stroke-width="2"/></pattern>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="12" fill="#a9d6e5"/><rect x="6" width="6" height="12" fill="#ffffff"/></pattern>
</defs>
<text x="24.0" y="46.0" font-size="32" text-anchor="start" font-weight="800" fill="#111" >제설차 상태기계 — idle · run · pause · stopped · error</text><text x="24.0" y="78.0" font-size="19" text-anchor="start" font-weight="600" fill="#2a6f97" >상태 이름은 UDP 텔레메트리 state 값과 같다.</text><rect x="70.0" y="150.0" width="300.0" height="100.0" rx="12" fill="#dceaf4" stroke="#012a4a" stroke-width="2.5" /><text x="220.0" y="190.0" font-size="26" text-anchor="middle" font-weight="800" fill="#012a4a" >idle</text><text x="220.0" y="218.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f3b52" >차고 안 서향 대기</text><text x="220.0" y="240.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f3b52" >코일 OFF</text><rect x="620.0" y="150.0" width="320.0" height="100.0" rx="12" fill="#cfe3f0" stroke="#012a4a" stroke-width="2.5" /><text x="780.0" y="190.0" font-size="26" text-anchor="middle" font-weight="800" fill="#012a4a" >run</text><text x="780.0" y="218.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f3b52" >계획 실행</text><text x="780.0" y="240.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f3b52" >phase depart~home</text><rect x="1150.0" y="150.0" width="300.0" height="100.0" rx="12" fill="#e8f1f8" stroke="#012a4a" stroke-width="2.5" /><text x="1300.0" y="190.0" font-size="26" text-anchor="middle" font-weight="800" fill="#012a4a" >pause</text><text x="1300.0" y="218.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f3b52" >모터 정지</text><text x="1300.0" y="240.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f3b52" >계획 유지</text><rect x="620.0" y="470.0" width="320.0" height="110.0" rx="12" fill="#b9d6e7" stroke="#012a4a" stroke-width="2.5" /><text x="780.0" y="510.0" font-size="26" text-anchor="middle" font-weight="800" fill="#012a4a" >stopped</text><text x="780.0" y="538.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f3b52" >코일 OFF · 서보 닫힘</text><text x="780.0" y="560.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f3b52" >위치 기억</text><rect x="1150.0" y="470.0" width="300.0" height="110.0" rx="12" fill="#dceaf4" stroke="#012a4a" stroke-width="2.5" /><text x="1300.0" y="510.0" font-size="26" text-anchor="middle" font-weight="800" fill="#012a4a" >error</text><text x="1300.0" y="538.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f3b52" >초기화·통신 실패</text><text x="1300.0" y="560.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1f3b52" >재부팅으로 복귀</text><line x1="370.0" y1="180.0" x2="620.0" y2="180.0" stroke="#012a4a" stroke-width="3" marker-end="url(#flow)"/><text x="495.0" y="164.0" font-size="19" text-anchor="middle" font-weight="800" fill="#012a4a" >plan</text><text x="495.0" y="206.0" font-size="14" text-anchor="middle" font-weight="600" fill="#2a6f97" >실행 중이면 ok=false</text><line x1="620.0" y1="222.0" x2="370.0" y2="222.0" stroke="#2a6f97" stroke-width="3" marker-end="url(#flowB)"/><text x="495.0" y="246.0" font-size="15" text-anchor="middle" font-weight="700" fill="#2a6f97" >plan_done / aborted</text><line x1="940.0" y1="180.0" x2="1150.0" y2="180.0" stroke="#012a4a" stroke-width="3" marker-end="url(#flow)"/><text x="1045.0" y="164.0" font-size="17" text-anchor="middle" font-weight="800" fill="#012a4a" >5초 무패킷</text><line x1="1150.0" y1="222.0" x2="940.0" y2="222.0" stroke="#2a6f97" stroke-width="3" marker-end="url(#flowB)"/><text x="1045.0" y="246.0" font-size="15" text-anchor="middle" font-weight="700" fill="#2a6f97" >패킷 수신</text><line x1="760.0" y1="250.0" x2="760.0" y2="470.0" stroke="#012a4a" stroke-width="3" marker-end="url(#flow)"/><text x="772.0" y="370.0" font-size="17" text-anchor="start" font-weight="800" fill="#012a4a" >stop / 버튼(선택)</text><line x1="690.0" y1="470.0" x2="690.0" y2="250.0" stroke="#2a6f97" stroke-width="3" marker-end="url(#flowB)"/><text x="678.0" y="370.0" font-size="17" text-anchor="end" font-weight="800" fill="#2a6f97" >버튼(선택, 재개)</text><path d="M 1300 250 L 1300 410 L 940 410 L 940 470" fill="none" stroke="#012a4a" stroke-width="3" marker-end="url(#flow)"/><text x="1120.0" y="398.0" font-size="17" text-anchor="middle" font-weight="800" fill="#012a4a" >stop / 버튼(선택)</text><path d="M 620 520 L 220 520 L 220 250" fill="none" stroke="#2a6f97" stroke-width="3" marker-end="url(#flowB)"/><text x="430.0" y="560.0" font-size="15" text-anchor="middle" font-weight="700" fill="#2a6f97" >home(차고 복귀) → idle</text><path d="M 700 150 C 700 76, 860 76, 860 150" fill="none" stroke="#014f86" stroke-width="3" marker-end="url(#flowB)"/><text x="780.0" y="68.0" font-size="16" text-anchor="middle" font-weight="800" fill="#014f86" >초음파(선택) &lt; 8cm → 모터 정지</text><rect x="70.0" y="640.0" width="470.0" height="330.0" rx="12" fill="#f4f8fb" stroke="#61a5c2" stroke-width="2" /><text x="96.0" y="678.0" font-size="22" text-anchor="start" font-weight="800" fill="#012a4a" >규칙</text><text x="96.0" y="716.0" font-size="17" text-anchor="start" font-weight="600" fill="#1f3b52" >· 같은 seq는 한 번만 실행한다.</text><text x="96.0" y="756.0" font-size="17" text-anchor="start" font-weight="600" fill="#1f3b52" >· 링크 5초 끊기면 pause, 다시 받으면 재개.</text><text x="96.0" y="796.0" font-size="17" text-anchor="start" font-weight="600" fill="#1f3b52" >· 초음파(선택) 8cm 안쪽이면 모터를 세운다.</text><text x="96.0" y="836.0" font-size="17" text-anchor="start" font-weight="600" fill="#1f3b52" >· 1초 비면 재개, 10초 막히면 aborted.</text><text x="96.0" y="876.0" font-size="17" text-anchor="start" font-weight="600" fill="#1f3b52" >· stop(·버튼): 코일 OFF, 서보 닫힘.</text><text x="96.0" y="916.0" font-size="17" text-anchor="start" font-weight="600" fill="#1f3b52" >· 부팅 직후는 idle, 차고 안 서향.</text><rect x="580.0" y="640.0" width="940.0" height="330.0" rx="12" fill="#f4f8fb" stroke="#61a5c2" stroke-width="2" /><text x="606.0" y="678.0" font-size="22" text-anchor="start" font-weight="800" fill="#012a4a" >run 내부 phase — depart 뒤 갈래마다 turn·out·back</text><rect x="606.0" y="706.0" width="190.0" height="96.0" rx="10" fill="#dceaf4" stroke="#01497c" stroke-width="2" /><text x="701.0" y="740.0" font-size="22" text-anchor="middle" font-weight="800" fill="#012a4a" >depart</text><text x="701.0" y="772.0" font-size="15" text-anchor="middle" font-weight="700" fill="#01497c" >서 182 → 남 230</text><line x1="800.0" y1="754.0" x2="828.0" y2="754.0" stroke="#012a4a" stroke-width="3" marker-end="url(#flow)"/><rect x="834.0" y="706.0" width="190.0" height="96.0" rx="10" fill="#cfe3f0" stroke="#01497c" stroke-width="2" /><text x="929.0" y="740.0" font-size="22" text-anchor="middle" font-weight="800" fill="#012a4a" >turn</text><text x="929.0" y="772.0" font-size="15" text-anchor="middle" font-weight="700" fill="#01497c" >갈래 방위 회전</text><line x1="1028.0" y1="754.0" x2="1056.0" y2="754.0" stroke="#012a4a" stroke-width="3" marker-end="url(#flow)"/><rect x="1062.0" y="706.0" width="190.0" height="96.0" rx="10" fill="#dceaf4" stroke="#01497c" stroke-width="2" /><text x="1157.0" y="740.0" font-size="22" text-anchor="middle" font-weight="800" fill="#012a4a" >out</text><text x="1157.0" y="772.0" font-size="15" text-anchor="middle" font-weight="700" fill="#01497c" >ARM_OUT 전진</text><line x1="1256.0" y1="754.0" x2="1284.0" y2="754.0" stroke="#012a4a" stroke-width="3" marker-end="url(#flow)"/><rect x="1290.0" y="706.0" width="190.0" height="96.0" rx="10" fill="#cfe3f0" stroke="#01497c" stroke-width="2" /><text x="1385.0" y="740.0" font-size="22" text-anchor="middle" font-weight="800" fill="#012a4a" >back</text><text x="1385.0" y="772.0" font-size="15" text-anchor="middle" font-weight="700" fill="#01497c" >같은 거리 후진</text><text x="606.0" y="846.0" font-size="17" text-anchor="start" font-weight="700" fill="#013a63" >서보(선택)를 달면 out 단계의 SPRAY_WIN(중심 100~ARM_OUT) 구간에서만 연다(열림 70°).</text><text x="606.0" y="882.0" font-size="17" text-anchor="start" font-weight="700" fill="#013a63" >갈래를 다 돌면 home(북쪽 230 → 서쪽을 보고 182 후진)으로 차고에 들어가 idle. 순서는 plan.order.</text><text x="606.0" y="918.0" font-size="17" text-anchor="start" font-weight="600" fill="#2a6f97" >실행 중에 새 plan이 오면 ack ok=false로 거절한다(계획 겹침 금지).</text></svg>