chor="start" font-weight="600" fill="#1f3b52" >· 사일로: 종이·PET 원뿔</text><text x="1490.0" y="408.0" font-size="14" text-anchor="start" font-weight="600" fill="#1f3b52" >· 출구 Ø12, SG90 패들 게이트</text><text x="1490.0" y="442.0" font-size="14" text-anchor="start" font-weight="600" fill="#1f3b52" >· 호퍼 입구 = 뒤 범퍼에서 75</text><text x="1490.0" y="476.0" font-size="14" text-anchor="start" font-weight="600" fill="#1f3b52" >· 뒤벽 범퍼판 60×30</text><text x="1490.0" y="510.0" font-size="14" text-anchor="start" font-weight="600" fill="#1f3b52" >· 도킹 스위치 = 뒤벽 뒤 택트</text><text x="1490.0" y="544.0" font-size="14" text-anchor="start" font-weight="600" fill="#1f3b52" >· 지붕 링 = WS2812 8픽셀</text><text x="1490.0" y="578.0" font-size="14" text-anchor="start" font-weight="600" fill="#1f3b52" >· 안내 레일 8mm(양쪽 벽)</text><text x="40.0" y="940.0" font-size="17" text-anchor="start" font-weight="700" fill="#012a4a" >차고 안내 레일 8mm는 바닥 양쪽 벽을 따라 붙여 차를 가운데로 모은다. 입구 벽 끝은 45°로 20mm 벌린 깔때기다.</text><text x="40.0" y="968.0" font-size="17" text-anchor="start" font-weight="600" fill="#2a6f97" >도킹: 차가 북향 후진으로 들어와 범퍼판을 밀면 도킹 스위치가 눌린다(눌리면 0). 그때 사일로 게이트가 열려 호퍼를 채운다.</text></svg>