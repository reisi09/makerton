<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 885 532" width="885" height="532" font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#247ba0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fb8500"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#006494"/></marker></defs><rect width="885" height="532" fill="#fff"/><rect x="9.0" y="21.0" width="224.0" height="140.0" rx="0" fill="#e8f1f2" stroke="#13293d" stroke-width="4"/><text x="21.0" y="56.0" font-size="19" font-weight="700" fill="#13293d" text-anchor="start">웹 화면 /app</text><text x="21.0" y="84.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">사진 → Claude 직접 호출</text><text x="21.0" y="103.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">눈 갈래 최적 경로 표시</text><text x="21.0" y="122.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">전체 청소 · 정지 버튼</text><text x="21.0" y="141.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">수동 조작 패드</text><rect x="331.0" y="21.0" width="224.0" height="140.0" rx="0" fill="#e8f1f2" stroke="#1b98e0" stroke-width="6"/><text x="343.0" y="56.0" font-size="19" font-weight="700" fill="#13293d" text-anchor="start">맥 서버 (Python)</text><text x="343.0" y="84.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">:8000 · /app · /monitor</text><text x="343.0" y="103.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">최적 경로: 순서 24가지 비교</text><text x="343.0" y="122.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">펌웨어 경로 계획 그대로</text><text x="343.0" y="141.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">HEIC 변환 · Claude 호출</text><rect x="653.0" y="21.0" width="224.0" height="140.0" rx="0" fill="#e8f1f2" stroke="#13293d" stroke-width="4"/><text x="665.0" y="56.0" font-size="19" font-weight="700" fill="#13293d" text-anchor="start">Claude API</text><text x="665.0" y="84.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">claude-opus-5-5</text><text x="665.0" y="103.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">사진 → 눈 상자 · 눈 갈래</text><text x="665.0" y="122.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">화면 표시만 (차는 그대로)</text><text x="665.0" y="141.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">키는 저장소에 두지 않음</text><rect x="9.0" y="281.0" width="224.0" height="140.0" rx="0" fill="#e8f1f2" stroke="#13293d" stroke-width="4"/><text x="21.0" y="316.0" font-size="19" font-weight="700" fill="#13293d" text-anchor="start">모니터 /monitor</text><text x="21.0" y="344.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">1920×1080 흑백 화면</text><text x="21.0" y="363.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">지도 · 경로 · 차 위치</text><text x="21.0" y="382.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">1초마다 갱신</text><text x="21.0" y="401.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">조작 버튼 없음</text><rect x="331.0" y="281.0" width="224.0" height="140.0" rx="0" fill="#e8f1f2" stroke="#1b98e0" stroke-width="6"/><text x="343.0" y="316.0" font-size="19" font-weight="700" fill="#13293d" text-anchor="start">제설차 Pico 2 W</text><text x="343.0" y="344.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">MicroPython 1.29</text><text x="343.0" y="363.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">28BYJ-48 ×2 + ULN2003 ×2</text><text x="343.0" y="382.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">기지 → 갈래 밀기 → 후진</text><text x="343.0" y="401.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">전원: 맥 USB</text><rect x="653.0" y="281.0" width="224.0" height="140.0" rx="0" fill="#e8f1f2" stroke="#13293d" stroke-width="4"/><text x="665.0" y="316.0" font-size="19" font-weight="700" fill="#13293d" text-anchor="start">수동 조작 (Web Serial)</text><text x="665.0" y="344.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">맥의 Chrome · Edge</text><text x="665.0" y="363.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">USB로 Pico에 직접 연결</text><text x="665.0" y="382.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">화살표 버튼 · 키</text><text x="665.0" y="401.0" font-size="14" font-weight="500" fill="#006494" text-anchor="start">떼면 바로 정지</text><polyline points="237.0,58.0 327.0,58.0" fill="none" stroke="#247ba0" stroke-width="3" stroke-linejoin="round"  marker-end="url(#ar)"/><text x="282.0" y="30.0" font-size="12" font-weight="700" fill="#006494" text-anchor="middle">사진</text><text x="282.0" y="46.0" font-size="12" font-weight="700" fill="#006494" text-anchor="middle">전체 청소·정지</text><polyline points="327.0,112.0 237.0,112.0" fill="none" stroke="#247ba0" stroke-width="3" stroke-linejoin="round"  marker-end="url(#ar)"/><text x="282.0" y="86.0" font-size="12" font-weight="600" fill="#247ba0" text-anchor="middle">눈 상자·경로</text><text x="282.0" y="102.0" font-size="12" font-weight="600" fill="#247ba0" text-anchor="middle">차 위치</text><polyline points="559.0,58.0 649.0,58.0" fill="none" stroke="#247ba0" stroke-width="3" stroke-linejoin="round"  marker-end="url(#ar)"/><text x="604.0" y="46.0" font-size="12" font-weight="700" fill="#006494" text-anchor="middle">사진</text><polyline points="649.0,112.0 559.0,112.0" fill="none" stroke="#247ba0" stroke-width="3" stroke-linejoin="round"  marker-end="url(#ar)"/><text x="604.0" y="132.0" font-size="12" font-weight="600" fill="#247ba0" text-anchor="middle">눈 상자·갈래</text><text x="604.0" y="148.0" font-size="12" font-weight="600" fill="#247ba0" text-anchor="middle">(JSON)</text><polyline points="331.0,150.0 290.0,150.0 290.0,321.0 237.0,321.0" fill="none" stroke="#247ba0" stroke-width="3" stroke-linejoin="round"  marker-end="url(#ar)"/><text x="282.0" y="205.0" font-size="12" font-weight="700" fill="#006494" text-anchor="end">같은 핫스팟</text><text x="282.0" y="221.0" font-size="12" font-weight="600" fill="#247ba0" text-anchor="end">1초 갱신</text><polyline points="443.0,165.0 443.0,277.0" fill="none" stroke="#247ba0" stroke-width="3" stroke-linejoin="round"  marker-end="url(#ar)" marker-start="url(#ar)"/><text x="433.0" y="205.0" font-size="14" font-weight="700" fill="#006494" text-anchor="end">Wi-Fi UDP</text><text x="433.0" y="222.0" font-size="12" font-weight="600" fill="#247ba0" text-anchor="end">9200 ⇄ 9201</text><text x="453.0" y="205.0" font-size="12" font-weight="700" fill="#006494" text-anchor="start">계획·정지 ↓  위치 0.5초 ↑</text><text x="453.0" y="222.0" font-size="12" font-weight="600" fill="#247ba0" text-anchor="start">아이폰 핫스팟 2.4GHz</text><text x="453.0" y="238.0" font-size="12" font-weight="600" fill="#247ba0" text-anchor="start">(호환성 최대화)</text><polyline points="649.0,351.0 559.0,351.0" fill="none" stroke="#247ba0" stroke-width="3" stroke-linejoin="round"  marker-end="url(#ar)"/><text x="604.0" y="339.0" font-size="12" font-weight="700" fill="#006494" text-anchor="middle">USB</text><text x="604.0" y="373.0" font-size="12" font-weight="600" fill="#247ba0" text-anchor="middle">Web Serial</text><rect x="9.0" y="445.0" width="868.0" height="78.0" rx="0" fill="#e8f1f2" stroke="#1b98e0" stroke-width="2"/><text x="22.0" y="470.0" font-size="14" font-weight="500" fill="#13293d" text-anchor="start">출동 버튼은 ‘전체 청소’ 하나. 누르면 서버가 갈래 순서 24가지를 펌웨어 경로 계획으로 비교해 가장 빠른 계획을 차에 보낸다.</text><text x="22.0" y="491.0" font-size="14" font-weight="500" fill="#13293d" text-anchor="start">네 갈래 S→E→W→N 약 140초(계산값). Claude가 알려 준 눈 갈래의 최적 순서·경로는 화면 표시만 하고 차는 그대로다.</text><text x="22.0" y="512.0" font-size="14" font-weight="500" fill="#13293d" text-anchor="start">키를 넣은 기기는 Claude를 직접 부르고, 없으면 서버를 거친다. 정지가 언제나 우선, 신호가 5초 끊기면 일시 정지.</text></svg>
